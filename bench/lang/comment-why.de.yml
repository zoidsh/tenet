# The comment-why rule translated into German for the language table in
# bench/results.md. Every example here is the English one from
# rules/comment-why/examples.yml with only its prose translated, so the two
# files must stay in step: an example added or relabelled there belongs here
# too, or the table compares two different corpora.
version: 1
tenets:
  - id: comment-why
    tenet: "Ein Kommentar sagt, warum der Code existiert oder warum er so geschrieben ist, und nicht, was der Code tut, was er früher tat oder was seine Deklaration bereits aussagt."
    criteria:
      true: "Ein Kommentar, der in einem Funktionskörper steht oder an einer Deklaration hängt und aus dem ein Leser des Codes nichts Neues erfährt: er erzählt die Schritte darunter nach, benennt die Operation, liest eine Bedingung oder einen Operator auf Deutsch zurück, wiederholt den Namen der Deklaration, ihre Parameter oder ihren Rückgabetyp, hält fest, was eine frühere Änderung geändert hat, oder ist eine Abschnittsüberschrift."
      false: "Der Kommentar nennt einen Grund, eine Einschränkung, einen Vertrag, einen Workaround für ein externes System, einen Verweis, der die Entscheidung erklärt, oder eine Warnung zu Reihenfolge oder Invarianten, die der Code nicht zeigt; oder er ist ein Doc-Kommentar, der Aufrufern etwas sagt, was die Deklaration nicht aussagt, etwa was die Funktion garantiert, wann sie fehlschlägt oder wie sie aufgerufen werden muss."
    source: tim/CLAUDE.md
    include: ["**/*.go", "**/*.ts", "**/*.tsx", "**/*.py"]
    kind: [code]
    tags: [code, comments]
    examples:
      - label: violation
        lines: 7
        code: |
          func (c *Counter) Record(event string) {
          	c.mu.Lock()
          	defer c.mu.Unlock()
          	if c.counts == nil {
          		c.counts = make(map[string]int)
          	}
          	// Zähler erhöhen
          	c.counts[event]++
          	c.total++
          	if c.total > c.limit {
