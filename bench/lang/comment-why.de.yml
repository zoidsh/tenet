      - label: ok
        code: |
          // Der Aufrufer hält das Lock.
          func (c *Cache) evictLocked(now time.Time) int {
          	removed := 0
          	for key, entry := range c.entries {
          		if entry.expiresAt.After(now) {
          			continue
          		}
          		delete(c.entries, key)
          		c.bytes -= entry.size
          		removed++
          	}
          	return removed
          }
      - label: ok
        code: |
          func FirstAfter(deadlines []time.Time, t time.Time) (time.Time, bool) {
          	if len(deadlines) == 0 {
          		return time.Time{}, false
          	}
          	// Zuerst sortieren, die binäre Suche unten setzt die Sortierung voraus
          	sort.Slice(deadlines, func(i, j int) bool {
          		return deadlines[i].Before(deadlines[j])
          	})
          	i := sort.Search(len(deadlines), func(i int) bool {
          		return deadlines[i].After(t)
          	})
          	if i == len(deadlines) {
          		return time.Time{}, false
          	}
          	return deadlines[i], true
          }
      - label: ok
        code: |
          func decodeFrame(r io.Reader) (*Frame, error) {
          	head := make([]byte, 8)
          	if _, err := io.ReadFull(r, head); err != nil {
          		return nil, err
          	}
          	size := binary.BigEndian.Uint32(head[4:])
          	// snappy v0.0.4 löst bei einem Block der Länge null eine Panik aus, deshalb vor Decode abkürzen.
          	if size == 0 {
          		return &Frame{Kind: head[0]}, nil
          	}
          	body := make([]byte, size)
          	if _, err := io.ReadFull(r, body); err != nil {
          		return nil, err
          	}
          	out, err := snappy.Decode(nil, body)
          	if err != nil {
          		return nil, err
          	}
          	return &Frame{Kind: head[0], Body: out}, nil
          }
      - label: ok
        lang: typescript
        code: |
          export class Uploader {
            private parts: Part[] = [];

            add(part: Part): void {
              this.parts.push(part);
            }

            // Aufrufer dürfen nach finish keine Parts mehr hinzufügen; die ETag-Liste ist hier festgeschrieben.
            async finish(): Promise<string> {
              const etags = this.parts.map((p) => p.etag);
              const res = await this.client.completeMultipart(this.uploadId, etags);
              this.parts.length = 0;
              return res.location;
            }
          }
      - label: ok
        lang: typescript
        code: |
          export function applyPatch(state: State, patch: Patch): State {
            if (patch.baseVersion !== state.version) {
              throw new ConflictError(patch.baseVersion, state.version);
            }
            const next = structuredClone(state);
            for (const op of patch.ops) {
              applyOp(next, op);
            }
            // Zuletzt hochzählen; applyOp oben liest next.version, um die Herkunft der Operation zu stempeln.
            next.version = patch.baseVersion + 1;
            return next;
          }
