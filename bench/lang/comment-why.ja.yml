          func (c *Counter) Record(event string) {
          	c.mu.Lock()
          	defer c.mu.Unlock()
          	if c.counts == nil {
          		c.counts = make(map[string]int)
          	}
          	// カウンタを増やす
          	c.counts[event]++
          	c.total++
          	if c.total > c.limit {
          		c.flush()
          	}
          }
