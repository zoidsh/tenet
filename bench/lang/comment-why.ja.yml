      - label: ok
        code: |
          // ロックは呼び出し側が保持している。
          func (c *Cache) evictLocked(now time.Time) int {
          	removed := 0
          	for key, entry := range c.entries {
          		if entry.expiresAt.After(now) {
          			continue
          		}
          		delete(c.entries, key)
          		c.bytes -= entry.size
          		removed++
          	}
          	return removed
          }
      - label: ok
        code: |
          func FirstAfter(deadlines []time.Time, t time.Time) (time.Time, bool) {
          	if len(deadlines) == 0 {
          		return time.Time{}, false
          	}
          	// 先にソートする。下の二分探索は順序を前提にしている
          	sort.Slice(deadlines, func(i, j int) bool {
          		return deadlines[i].Before(deadlines[j])
          	})
          	i := sort.Search(len(deadlines), func(i int) bool {
          		return deadlines[i].After(t)
          	})
          	if i == len(deadlines) {
          		return time.Time{}, false
          	}
          	return deadlines[i], true
          }
      - label: ok
        code: |
          func decodeFrame(r io.Reader) (*Frame, error) {
          	head := make([]byte, 8)
          	if _, err := io.ReadFull(r, head); err != nil {
          		return nil, err
          	}
          	size := binary.BigEndian.Uint32(head[4:])
          	// snappy v0.0.4 は長さ 0 のブロックでパニックするので、Decode の前で切り上げる。
          	if size == 0 {
          		return &Frame{Kind: head[0]}, nil
          	}
          	body := make([]byte, size)
          	if _, err := io.ReadFull(r, body); err != nil {
          		return nil, err
          	}
          	out, err := snappy.Decode(nil, body)
          	if err != nil {
          		return nil, err
          	}
          	return &Frame{Kind: head[0], Body: out}, nil
          }
