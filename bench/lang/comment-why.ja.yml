# The comment-why rule translated into Japanese for the language table in
# bench/results.md. Every example here is the English one from
# rules/comment-why/examples.yml with only its prose translated, so the two
# files must stay in step: an example added or relabelled there belongs here
# too, or the table compares two different corpora.
version: 1
tenets:
  - id: comment-why
    tenet: "コメントは、そのコードがなぜ存在するのか、なぜそう書かれているのかを述べるものであって、コードが何をしているか、以前は何をしていたか、宣言がすでに示していることを述べるものではない。"
    criteria:
      true: "関数本体の中にある、または宣言に付けられたコメントのうち、コードを読む人が何も新しく知ることのないもの。すぐ下の手順をなぞる、操作の名前を言い直す、条件や演算子を日本語で読み上げ直す、宣言の名前・引数・戻り値の型を繰り返す、過去の変更で何が変わったかを記録する、あるいは節の見出しになっている。"
      false: "コメントが、理由、制約、契約、外部システムに対する回避策、その選択を説明する参照先、またはコードが示していない順序や不変条件についての警告を与えている。あるいは、関数が何を保証するか、いつ失敗するか、どう呼び出さなければならないかなど、宣言が示していないことを呼び出し側に伝えるドキュメンテーションコメントである。"
    source: tim/CLAUDE.md
    include: ["**/*.go", "**/*.ts", "**/*.tsx", "**/*.py"]
    kind: [code]
    tags: [code, comments]
    examples:
