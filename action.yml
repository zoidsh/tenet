name: tenetlint
description: Lint a pull request against the tenets in its tenets.yml
branding:
  icon: check-square
  color: purple

inputs:
  version:
    description: The tenetlint release to run, or latest
    default: latest
  base:
    description: >
      The commit to lint the branch against. The default covers a pull request
      and a push to an existing branch; the first push to a new branch has a
      github.event.before of all zeroes, which is no commit, so set this
      yourself on a workflow that has to cover one.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  args:
    description: Extra flags passed to tenet
    default: ""
  api-key:
    description: A TypeSafe API key, which the lint needs to reach jev
    required: true

runs:
  using: composite
  steps:
    - name: Install tenetlint
      shell: bash
      env:
        TENETLINT_VERSION: ${{ inputs.version }}
        TENETLINT_INSTALL_DIR: ${{ runner.temp }}/tenetlint
      run: |
        sh "${{ github.action_path }}/install.sh"
        echo "$TENETLINT_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Lint the branch
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        TENETLINT_BASE: ${{ inputs.base }}
        TENETLINT_ARGS: ${{ inputs.args }}
      # The inputs arrive as environment variables rather than as expansions in
      # the script, so that what a caller writes cannot become shell syntax.
      # $TENETLINT_ARGS is deliberately unquoted: it is a list of flags.
      run: tenet --base "$TENETLINT_BASE" --format json $TENETLINT_ARGS
