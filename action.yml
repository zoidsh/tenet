name: tenet
description: Lint a pull request against the tenets in its .tenet/config.yml
branding:
  icon: check-square
  color: purple

inputs:
  version:
    description: The tenet release to run, or latest
    default: latest
  base:
    description: >
      The commit to lint the branch against. The default covers a pull request
      and a push to an existing branch; the first push to a new branch has a
      github.event.before of all zeroes, which is no commit, so set this
      yourself on a workflow that has to cover one.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  args:
    description: Extra flags passed to tenet
    default: ""
  annotate:
    description: >
      Print the findings as workflow commands, which GitHub shows on the lines
      of the diff they were raised on. Turn it off for JSON in the log instead.
    default: "true"
  api-key:
    description: A TypeSafe API key, which the lint needs to reach jev
    required: true

runs:
  using: composite
  steps:
    - name: Install tenet
      shell: bash
      env:
        TENET_VERSION: ${{ inputs.version }}
        TENET_INSTALL_DIR: ${{ runner.temp }}/tenet
      run: |
        sh "${{ github.action_path }}/install.sh"
        echo "$TENET_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Lint the branch
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
        TENET_BASE: ${{ inputs.base }}
        TENET_ARGS: ${{ inputs.args }}
        TENET_ANNOTATE: ${{ inputs.annotate }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      # The inputs arrive as environment variables rather than as expansions in
      # the script, so that what a caller writes cannot become shell syntax.
      # The title and the description are written by whoever opened the pull
      # request, so they are held to the same rule.
      # $TENET_ARGS is deliberately unquoted: it is a list of flags.
      run: |
        format=json
        if [ "$TENET_ANNOTATE" = "true" ]; then
          format=github
        fi
        code=0
        tenet --base "$TENET_BASE" --format "$format" $TENET_ARGS || code=$?
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          # Both lints are one verdict, so the worse of the two codes is the
          # step's, and a finding in either is still reported before it exits.
          text=0
          tenet --pr-text "$RUNNER_TEMP/pr.txt" --format "$format" $TENET_ARGS || text=$?
          if [ "$text" -gt "$code" ]; then
            code=$text
          fi
        fi
        exit $code
