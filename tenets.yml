  - id: no-mocking
    tenet: You must never mock anything in tests.
    criteria:
      true: The test replaces a real dependency with a mock, stub, spy, fake, or patched function, using a mocking library or hand-written substitute, and asserts on or relies on that substitute.
      false: The test exercises real implementations, in-memory or temporary real resources such as a temp directory or an in-process server, fixtures, or table-driven inputs, with no substituted dependencies.
    severity: warn
    include: ["**/*_test.go"]
    examples:
      - label: violation
        line: 1
        code: |
          type recordingNotifier struct {
          	sent []string
          }

          func (r *recordingNotifier) Notify(ctx context.Context, userID string) error {
          	r.sent = append(r.sent, userID)
          	return nil
          }

          func TestDigestNotifiesEverySubscriber(t *testing.T) {
          	rec := &recordingNotifier{}
          	svc := NewDigestService(rec)

          	if err := svc.SendDigest(context.Background(), []string{"u1", "u2"}); err != nil {
          		t.Fatalf("SendDigest: %v", err)
          	}

          	want := []string{"u1", "u2"}
          	if !reflect.DeepEqual(rec.sent, want) {
          		t.Errorf("notified %v, want %v", rec.sent, want)
          	}
          }
