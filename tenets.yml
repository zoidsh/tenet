          	month := r.URL.Query().Get("month")
          	var total int64
          	err := s.db.QueryRowContext(r.Context(), totalQuery, month).Scan(&total)
          	if err != nil {
          		log.Println("report total:", err)
          	}
          	resp := ReportResponse{
          		Month: month,
          		Total: total,
          	}
          	w.Header().Set("Content-Type", "application/json")
          	return json.NewEncoder(w).Encode(resp)
          }
