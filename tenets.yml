        code: |
          type Unavailable struct {
          	Service string
          	Until   time.Time
          }

          func (e *Unavailable) Error() string {
          	return fmt.Sprintf("%s unavailable until %s", e.Service, e.Until.Format(time.RFC3339))
          }

          func (b *Breaker) Do(ctx context.Context, fn func(context.Context) error) error {
          	b.mu.Lock()
          	open := b.failures >= b.threshold && b.clock.Now().Before(b.openUntil)
          	b.mu.Unlock()
          	if open {
          		return &Unavailable{Service: b.name, Until: b.openUntil}
          	}
          	if err := fn(ctx); err != nil {
          		b.recordFailure()
          		return err
          	}
          	b.recordSuccess()
          	return nil
          }
