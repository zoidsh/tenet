          func (s *Scheduler) NextRun(job Job, now time.Time) (time.Time, error) {
          	// Lookup returns nil when the job has no schedule configured.
          	spec := s.specs.Lookup(job.ID)
          	if spec == nil {
          		return time.Time{}, ErrNoSchedule
          	}
          	next := spec.Next(now)
          	if next.IsZero() {
          		return time.Time{}, ErrScheduleExhausted
          	}
          	if next.Before(now) {
          		next = now
          	}
          	return next, nil
          }
