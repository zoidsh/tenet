<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tenet · every commit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
	--plane: #0a0a09;
	--surface: #16161a;
	--pane: #101014;
	--ink: #f4f4ef;
	--ink-2: #c3c2b7;
	/* Both greys clear 4.5:1 on --pane, which 18px text needs at the size this
	   clip is watched: --muted 5.5, --faint 4.5. */
	--muted: #8b8a82;
	--faint: #7d7c75;
	--hairline: rgba(244, 244, 239, 0.10);
	--wash: rgba(244, 244, 239, 0.045);
	--grid: #3a3a37;
	/* Red and green are the verdict's, and nothing else in the frame wears
	   them: a diff's added and removed lines are told apart by their sign and
	   their weight on the neutral scale. */
	--fail: #d03b3b;
	--fail-text: #ef6b6b;
	--fail-wash: rgba(208, 59, 59, 0.16);
	--pass: #3fb950;
	--quiet-bar: #4a6f8f;

	--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;

	--line: 24px;
	--ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

* { box-sizing: border-box; }

html, body {
	height: 100%;
	margin: 0;
}

body {
	background: var(--plane);
	color: var(--ink);
	font-family: var(--sans);
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}

/* The stage is exactly the frame a 720p recording captures; it only ever
   scales down, so a smaller window previews the same composition. Every size
   in here is set for a viewer watching that frame about 500px wide. */
#stage {
	position: relative;
	width: 1280px;
	height: 720px;
	flex: 0 0 auto;
	transform-origin: center center;
	background: var(--surface);
	border: 1px solid var(--hairline);
	border-radius: 10px;
	display: grid;
	grid-template-rows: 52px 84px 1fr 110px 40px;
	overflow: hidden;
}

header {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 16px;
	padding: 14px 22px 0;
	border-bottom: 1px solid var(--hairline);
}

header .brand {
	font-size: 20px;
	font-weight: 600;
	letter-spacing: -0.01em;
	color: var(--ink);
	margin-right: 12px;
}

header .tagline { font-size: 18px; color: var(--muted); }
header .repo { font-family: var(--mono); font-size: 18px; color: var(--muted); }
header .left { display: flex; align-items: baseline; }

.headline {
	padding: 0 22px;
	display: flex;
	flex-direction: column;
	justify-content: center;
	gap: 4px;
	border-bottom: 1px solid var(--hairline);
}

#headline {
	font-size: 36px;
	font-weight: 600;
	line-height: 44px;
	letter-spacing: -0.015em;
	margin: 0;
	color: var(--ink);
}

#headline .tail { transition: opacity 300ms var(--ease); }
#headline .tail.bad { color: var(--fail); }
#headline .tail.good { color: var(--pass); }

#subline {
	font-family: var(--mono);
	font-size: 18px;
	line-height: 22px;
	color: var(--muted);
	margin: 0;
}

main {
	display: grid;
	grid-template-columns: 640px 1fr;
	min-height: 0;
}

.pane {
	padding: 6px 22px;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: 14px;
}

.pane.left { border-right: 1px solid var(--hairline); background: var(--pane); }

#filemeta {
	font-family: var(--mono);
	font-size: 18px;
	line-height: 22px;
	color: var(--muted);
	margin: 0;
	font-variant-numeric: tabular-nums;
}

.body {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
	font-family: var(--mono);
	font-size: 18px;
	line-height: var(--line);
	tab-size: 2;
}

.layer {
	position: absolute;
	inset: 0;
	transition: opacity var(--fade, 500ms) var(--ease);
}

.layer[data-state="hidden"] { opacity: 0; }

/* A line too long for the pane wraps rather than being cut: every character
   shown is the file's own. */
.row {
	display: grid;
	grid-template-columns: 24px 14px 1fr;
	align-items: baseline;
	min-height: var(--line);
	border-left: 2px solid transparent;
	padding-left: 6px;
	white-space: pre-wrap;
	overflow-wrap: break-word;
	opacity: 0;
	transition: opacity 200ms var(--ease);
}

.row.text-only {
	grid-template-columns: 24px 1fr;
	min-height: 22px;
	line-height: 22px;
}
.row.in { opacity: 1; }

.row .sign { color: var(--muted); }
.row .text { color: var(--ink-2); }

.row.file .text { color: var(--ink); font-weight: 700; }
.row.gap .text { color: var(--faint); }
.row.add { background: var(--wash); }
.row.del .sign, .row.del .text { color: var(--faint); }

.row.hit {
	background: var(--fail-wash);
	border-left-color: var(--fail);
	transition: opacity 200ms var(--ease), background 300ms var(--ease), border-color 300ms var(--ease);
}

.row.hit .text { color: #f6d0d0; }

.marker {
	width: 22px;
	height: 22px;
	border-radius: 11px;
	background: var(--fail);
	color: #ffffff;
	font-family: var(--mono);
	font-size: 14px;
	font-weight: 700;
	line-height: 22px;
	text-align: center;
	opacity: 0;
	transition: opacity 300ms var(--ease);
}

.marker[data-shown="1"] { opacity: 1; }

.clock { display: flex; flex-direction: column; }

.clock .top {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 16px;
}

#counter {
	font-family: var(--mono);
	font-size: 48px;
	font-weight: 700;
	line-height: 52px;
	color: var(--ink);
	font-variant-numeric: tabular-nums;
}

#cost {
	font-family: var(--mono);
	font-size: 24px;
	line-height: 30px;
	color: var(--ink-2);
	font-variant-numeric: tabular-nums;
}

.clock .caption {
	font-size: 16px;
	line-height: 20px;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	color: var(--muted);
}

.tenets {
	position: relative;
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	justify-content: center;
	gap: 12px;
}

.tenet .label {
	display: flex;
	align-items: center;
	gap: 8px;
	height: 24px;
}

.tenet .id {
	font-family: var(--mono);
	font-size: 20px;
	line-height: 24px;
	color: var(--ink-2);
	flex: 0 0 auto;
}

.tenet .gloss {
	font-size: 18px;
	line-height: 24px;
	color: var(--muted);
	margin-left: 4px;
	flex: 1 1 auto;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

.tenet.over .id { color: var(--ink); font-weight: 500; }

.track {
	position: relative;
	height: 16px;
	margin-top: 4px;
	background: rgba(244, 244, 239, 0.06);
	border-radius: 2px;
}

.fill {
	height: 100%;
	width: 0;
	background: var(--quiet-bar);
	border-radius: 0 4px 4px 0;
	transition: width var(--bar-dur, 450ms) var(--ease), background-color 200ms var(--ease);
}

.tenet.over .fill { background: var(--fail); }

.value {
	position: absolute;
	top: -1px;
	left: 0;
	transform: translateX(8px);
	font-family: var(--mono);
	font-size: 18px;
	line-height: 18px;
	color: var(--muted);
	font-variant-numeric: tabular-nums;
	transition: left var(--bar-dur, 450ms) var(--ease);
}

.tenet.over .value { color: var(--ink); }

/* Past three quarters of the track the tip label would run off the pane, so it
   sits inside the bar end, in white against the fill. */
.value.inside {
	transform: translateX(-100%) translateX(-8px);
	color: #ffffff;
}

.tenet .at {
	font-family: var(--mono);
	font-size: 18px;
	line-height: 18px;
	height: 18px;
	margin-top: 2px;
	color: var(--fail-text);
	font-variant-numeric: tabular-nums;
}

/* One cutoff for every bar, so the rows are read against a single scale. The
   subline names it, so the mark carries no label of its own. */
#cutoff {
	position: absolute;
	top: 0;
	bottom: 0;
	width: 1px;
	background: var(--grid);
	pointer-events: none;
}

#status {
	font-size: 28px;
	font-weight: 600;
	line-height: 30px;
	height: 30px;
	color: var(--muted);
	transition: color 200ms var(--ease);
}

#status.bad { color: var(--fail); }
#status.good { color: var(--pass); }
#status.note { font-size: 24px; font-weight: 400; color: var(--ink-2); }

footer {
	border-top: 1px solid var(--hairline);
	padding: 0 22px;
	display: flex;
	align-items: center;
}

#strip {
	font-family: var(--mono);
	font-size: 18px;
	color: var(--muted);
	font-variant-numeric: tabular-nums;
}

.session {
	border-top: 1px solid var(--hairline);
	background: var(--pane);
	padding: 12px 22px;
	overflow: hidden;
}

#session {
	font-family: var(--mono);
	font-size: 18px;
	line-height: 24px;
	transition: transform 300ms var(--ease);
}

#session .line { height: 24px; white-space: pre; color: var(--ink-2); }
#session .line.tool { color: var(--muted); }
#session .line.tool.bad { color: var(--fail-text); }
#session .line.tool.good { color: var(--pass); }
#session .line.agent { color: var(--ink); }

#card {
	position: absolute;
	inset: 0;
	background: var(--surface);
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	text-align: center;
	opacity: 0;
	pointer-events: none;
	transition: opacity var(--card-fade, 500ms) var(--ease);
}

#card[data-shown="1"] { opacity: 1; }

#card .name {
	font-size: 64px;
	font-weight: 600;
	letter-spacing: -0.02em;
	line-height: 68px;
}

#card .what { font-size: 28px; color: var(--ink-2); line-height: 34px; }
#card .how { font-size: 22px; color: var(--muted); line-height: 28px; }
#card .repo { font-family: var(--mono); font-size: 24px; color: var(--ink-2); line-height: 30px; margin-top: 10px; }

/* Black before the first frame and after the last, so the cut points are
   clean, and a hairline along the bottom edge that says how much of the clip
   is left to record. */
#blackout {
	position: absolute;
	inset: 0;
	background: #000000;
	pointer-events: none;
}

#blackout[data-shown="0"] { opacity: 0; }

#progress {
	position: absolute;
	left: 0;
	bottom: 0;
	height: 3px;
	width: 0;
	background: var(--grid);
	pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
	.layer, .fill, .value, .row, .marker, #card, #session { transition-duration: 1ms; }
}
</style>
</head>
<body>
<div id="stage">
	<header>
		<span class="left"><span class="brand">tenet</span><span class="tagline">the review gate for code that agents write</span></span>
		<span class="repo">github.com/zoidsh/tenet</span>
	</header>

	<div class="headline">
		<p id="headline"></p>
		<p id="subline"></p>
	</div>

	<main>
		<section class="pane left">
			<p id="filemeta"></p>
			<div class="body">
				<div class="layer" id="layer-blocked"></div>
				<div class="layer" id="layer-passed" data-state="hidden"></div>
			</div>
		</section>

		<section class="pane right">
			<div class="clock">
				<div class="top">
					<span id="counter">0.00 s</span>
					<span id="cost"></span>
				</div>
				<span class="caption" id="clock-caption"></span>
			</div>
			<div class="tenets" id="tenets">
				<div id="cutoff"></div>
			</div>
			<div id="status"></div>
		</section>
	</main>

	<div class="session"><div id="session"></div></div>

	<footer><span id="strip"></span></footer>

	<div id="card">
		<div class="name">tenet</div>
		<div class="what">the review gate for code that agents write</div>
		<div class="how">rules in plain language · code, commit messages and pull requests · about a second · a fraction of a cent</div>
		<div class="repo">github.com/zoidsh/tenet</div>
	</div>

	<div id="progress"></div>
	<div id="blackout" data-shown="1"></div>
</div>

<script>
// Every id, path, line number and number below is copied out of demo/data: six
// runs of the sample project in demo/sample against its own tenet.yml,
// measured on 2026-09-18 with an empty cache. A run prints a probability only
// for a finding or for a near miss within 0.2 of its cutoff, so the numbers
// under 0.80 were read off the same cached answers by moving the cutoff, which
// is cutoff-sweep.txt. Where a tenet was asked about two windows, p is the
// higher of its two answers, which is the one its verdict rests on. Each gloss
// is the rule's own sentence in a handful of words, from rules/<id>/rule.yml
// and, for money-in-cents, demo/sample/tenet.yml.
const GLOSS = {
	"comment-why": "a comment says why, not what",
	"no-mocking": "tests use the real dependency",
	"no-fallback": "no silent fallback, raise the error",
	"money-in-cents": "money is integer cents, never a float",
	"subject-says-what-changed": "the title says what changed",
	"body-says-why": "the description gives the why",
	"body-states-door": "says how far it walks back",
	"body-few-visuals": "one or two visuals, no more"
};

// The code act's four rows are the four that fire, which is what the frame has
// room for. The three of agent-hygiene left out stayed well under the cutoff
// in both runs: no-transcript-comment at 0.09 and 0.13, no-placeholder-phrase
// and assertion-justified under 0.10 in each.
const CODE_BLOCKED = [
	{ id: "no-fallback", p: 0.94, at: "billing.go:28" },
	{ id: "money-in-cents", p: 0.95, at: "billing.go:34" },
	{ id: "comment-why", p: 0.88, at: "billing.go:36" },
	{ id: "no-mocking", p: 0.90, at: "billing_test.go:36" }
];

const CODE_PASSED = [
	{ id: "no-fallback", p: 0.28, at: null },
	{ id: "money-in-cents", p: 0.08, at: null },
	{ id: "comment-why", p: 0.30, at: null },
	{ id: "no-mocking", p: 0.34, at: null }
];

// Verbatim from demo/sample/agent-change.patch and agent-fix.patch, cut to the
// lines the findings name and their context, with a gap row wherever lines are
// left out.
const CODE_DIFF_BLOCKED = [
	{ k: "file", t: "billing.go" },
	{ k: "add", t: "\tif err != nil {" },
	{ k: "add", t: "\t\tpercent = 0", hit: "no-fallback" },
	{ k: "add", t: "\t}" },
	{ k: "gap", t: "…" },
	{ k: "add", t: "func DiscountedTotal(totalCents int, discount Discount) float64 {", hit: "money-in-cents" },
	{ k: "add", t: "\t// divide the cents by 100 to get dollars" },
	{ k: "add", t: "\tdollars := float64(totalCents) / 100", hit: "comment-why" },
	{ k: "add", t: "\treturn dollars - dollars*discount.Percent/100" },
	{ k: "gap", t: "…" },
	{ k: "file", t: "billing_test.go" },
	{ k: "add", t: "func TestDiscountedTotal(t *testing.T) {" },
	{ k: "add", t: "\trepo := stubRepository{invoice: Invoice{", hit: "no-mocking" },
	{ k: "add", t: "\t\tID:    \"INV-1042\"," }
];

const CODE_DIFF_PASSED = [
	{ k: "file", t: "billing.go" },
	{ k: "del", t: "\tPercent float64" },
	{ k: "add", t: "\tPercent int" },
	{ k: "gap", t: "…" },
	{ k: "del", t: "\t\tpercent = 0" },
	{ k: "gap", t: "…" },
	{ k: "add", t: "func DiscountedTotalCents(totalCents int, discount Discount) int {" },
	{ k: "add", t: "\treturn totalCents - (totalCents*discount.Percent+99)/100" },
	{ k: "file", t: "billing_test.go" },
	{ k: "del", t: "type stubRepository struct {" },
	{ k: "gap", t: "…" },
	{ k: "del", t: "\trepo := stubRepository{invoice: Invoice{" },
	{ k: "add", t: "\trepo := NewMemoryRepository(Invoice{" }
];

// demo/sample/commit-msg-bad.txt and commit-msg-good.txt, line for line. The
// finding lands on COMMIT_EDITMSG:1.
const COMMIT_BAD = [
	{ k: "plain", t: "Update billing.go and billing_test.go", hit: "subject-says-what-changed" }
];

const COMMIT_GOOD = [
	{ k: "plain", t: "Add discount codes, rounding half cents to the house" },
	{ k: "plain", t: "" },
	{ k: "plain", t: "The sales team keyed discounted totals in by hand, and" },
	{ k: "plain", t: "that is where most invoice corrections came from." }
];

// demo/sample/pr-bad.txt and pr-good.txt, line for line. The findings land on
// PULL_REQUEST lines 1, 5, 10 and 13.
const PR_BAD = [
	{ k: "plain", t: "Update billing.go and billing_test.go", hit: "subject-says-what-changed" },
	{ k: "plain", t: "" },
	{ k: "plain", t: "Changes in this pull request:" },
	{ k: "plain", t: "" },
	{ k: "plain", t: "- billing.go: adds Discount, ParseDiscount and", hit: "body-says-why" },
	{ k: "plain", t: "  DiscountedTotal" },
	{ k: "plain", t: "- billing_test.go: adds stubRepository and" },
	{ k: "plain", t: "  TestDiscountedTotal" },
	{ k: "plain", t: "" },
	{ k: "plain", t: "![before](before.png)", hit: "body-few-visuals" },
	{ k: "plain", t: "![after](after.png)" },
	{ k: "plain", t: "![terminal](terminal.png)" },
	{ k: "plain", t: "![coverage](coverage.png)", hit: "body-states-door" }
];

const PR_GOOD = [
	{ k: "plain", t: "Add discount codes to invoice totals" },
	{ k: "plain", t: "" },
	{ k: "plain", t: "Sales has been giving discounts over the phone and" },
	{ k: "plain", t: "keying the reduced total in by hand, which is where" },
	{ k: "plain", t: "most of this month's invoice corrections came from." },
	{ k: "plain", t: "A code on the invoice carries the discount itself." },
	{ k: "plain", t: "" },
	{ k: "plain", t: "Rounding goes to the house: half a cent of discount" },
	{ k: "plain", t: "is dropped rather than given away, because the" },
	{ k: "plain", t: "ledger reconciles in whole cents." },
	{ k: "plain", t: "" },
	{ k: "plain", t: "A two-way door. The field is additive and nothing" },
	{ k: "plain", t: "outside DiscountedTotalCents reads it, so reverting" },
	{ k: "plain", t: "this commit walks the change back." },
	{ k: "plain", t: "" },
	{ k: "plain", t: "Look at the rounding in DiscountedTotalCents first." }
];

const PR_ROWS_BLOCKED = [
	{ id: "subject-says-what-changed", p: 0.94, at: "PULL_REQUEST:1" },
	{ id: "body-says-why", p: 0.94, at: "PULL_REQUEST:5" },
	{ id: "body-few-visuals", p: 0.97, at: "PULL_REQUEST:10" },
	{ id: "body-states-door", p: 0.88, at: "PULL_REQUEST:13" }
];

const PR_ROWS_PASSED = [
	{ id: "subject-says-what-changed", p: 0.14, at: null },
	{ id: "body-says-why", p: 0.13, at: null },
	{ id: "body-few-visuals", p: 0.13, at: null },
	{ id: "body-states-door", p: 0.17, at: null }
];

// One scene per act. Each carries the two states it plays: what the left pane
// holds, the rows on the right, and the run whose numbers the clock, the cost
// and the bottom strip show.
const ACTS = [
	{
		key: "code",
		unit: "commit",
		lead: "Add discount codes.",
		fixedLead: "Fixed by the agent.",
		caption: "the agent fixes its own findings",
		source: "the AGENTS.md rules",
		meta: "northwind/invoicing · 2 files changed, +52",
		fixedMeta: "northwind/invoicing · 2 files changed, +22 −28",
		left: CODE_DIFF_BLOCKED,
		fixedLeft: CODE_DIFF_PASSED,
		rows: CODE_BLOCKED,
		fixedRows: CODE_PASSED,
		blocked: { findings: 4, duration_ms: 893, input_tokens: 7575, cost_usd: 0.000318, calls: 4, windows: 2 },
		passed: { findings: 0, duration_ms: 795, input_tokens: 4530, cost_usd: 0.000190, calls: 2, windows: 2 },
		session: [
			{ when: "open", kind: "prompt", t: "$ git commit -m \"Add discount codes\"" },
			{ when: "verdict", kind: "tool bad", t: "tenet: 4 findings · commit blocked" },
			{ when: "caption", kind: "agent", t: "● fixing billing.go:28, :34, :36 and billing_test.go:36" },
			{ when: "again", kind: "prompt", t: "$ git commit -m \"Add discount codes\"" },
			{ when: "pass", kind: "tool good", t: "tenet: 0 findings · committed" }
		]
	},
	{
		key: "commit",
		unit: "message",
		lead: "Commit message.",
		fixedLead: "Reworded.",
		caption: "the agent rewords the subject",
		source: "the pr preset",
		meta: "COMMIT_EDITMSG · the message this commit carries",
		fixedMeta: "COMMIT_EDITMSG · the message this commit carries",
		left: COMMIT_BAD,
		fixedLeft: COMMIT_GOOD,
		rows: [{ id: "subject-says-what-changed", p: 0.96, at: "COMMIT_EDITMSG:1" }],
		fixedRows: [{ id: "subject-says-what-changed", p: 0.14, at: null }],
		blocked: { findings: 1, duration_ms: 781, input_tokens: 891, cost_usd: 0.000037, calls: 2, windows: 1 },
		passed: { findings: 0, duration_ms: 545, input_tokens: 573, cost_usd: 0.000024, calls: 1, windows: 1 },
		session: [
			{ when: "open", kind: "prompt", t: "$ git commit" },
			{ when: "verdict", kind: "tool bad", t: "tenet: 1 finding · reword the message" },
			{ when: "caption", kind: "agent", t: "● rewording the subject" },
			{ when: "again", kind: "prompt", t: "$ git commit" },
			{ when: "pass", kind: "tool good", t: "tenet: 0 findings · committed" }
		]
	},
	{
		key: "pr",
		unit: "pull request",
		lead: "Pull request.",
		fixedLead: "Rewritten.",
		caption: "the agent rewrites the description",
		source: "the pr preset",
		meta: "PULL_REQUEST · the title and description",
		fixedMeta: "PULL_REQUEST · the title and description",
		left: PR_BAD,
		fixedLeft: PR_GOOD,
		rows: PR_ROWS_BLOCKED,
		fixedRows: PR_ROWS_PASSED,
		blocked: { findings: 4, duration_ms: 726, input_tokens: 2840, cost_usd: 0.000119, calls: 2, windows: 1 },
		passed: { findings: 0, duration_ms: 554, input_tokens: 1749, cost_usd: 0.000073, calls: 1, windows: 1 },
		session: [
			{ when: "open", kind: "prompt", t: "$ gh pr create" },
			{ when: "verdict", kind: "tool bad", t: "tenet: 4 findings on the pull request" },
			{ when: "caption", kind: "agent", t: "● rewriting the description" },
			{ when: "again", kind: "prompt", t: "$ gh pr create" },
			{ when: "pass", kind: "tool good", t: "tenet: 0 findings · pull request opened" }
		]
	}
];

// The timeline, in milliseconds. PRE and POST are the black holds that give
// the recording clean cut points; the three acts start at AT, and everything
// inside an act is measured from its own start by OFF. TOTAL is logged on
// load and is what the progress line at the bottom edge runs over.
const T = {
	PRE: 400,
	POST: 400,
	AT: [0, 11000, 17000],
	END: 23000,
	CARD_HOLD: 3000,
	CARD_FADE: 500,
	BAR_STAGGER: 90,
	BAR_DUR: 450,
	VERDICT_GAP: 120,
	COUNT_TICKS: 30,
	TYPE_MS: 20,
	TYPE_LEAD: 800,
	OFF: {
		code: { textIn: 200, stagger: 45, ask: 1600, bars: 2000, caption: 6500, swap: 7000, rebars: 8100 },
		text: { textIn: 150, stagger: 60, ask: 800, bars: 1000, caption: 3300, swap: 3600, rebars: 4300 }
	}
};

const CUTOFF = 0.8;
const TOTAL = T.PRE + T.END + T.CARD_HOLD + T.POST;

function offsets(act) {
	return act.key === "code" ? T.OFF.code : T.OFF.text;
}

function barsEnd(act, start) {
	return start + (act.rows.length - 1) * T.BAR_STAGGER + T.BAR_DUR;
}

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const stage = document.getElementById("stage");
const headlineEl = document.getElementById("headline");
const sublineEl = document.getElementById("subline");
const fileMetaEl = document.getElementById("filemeta");
const counterEl = document.getElementById("counter");
const costEl = document.getElementById("cost");
const clockCaptionEl = document.getElementById("clock-caption");
const stripEl = document.getElementById("strip");
const statusEl = document.getElementById("status");
const tenetsEl = document.getElementById("tenets");
const cutoffEl = document.getElementById("cutoff");
const cardEl = document.getElementById("card");
const blackoutEl = document.getElementById("blackout");
const progressEl = document.getElementById("progress");
const sessionEl = document.getElementById("session");
const blockedLayer = document.getElementById("layer-blocked");
const passedLayer = document.getElementById("layer-passed");

function fit() {
	const scale = Math.min(1, window.innerWidth / 1280, window.innerHeight / 720);
	stage.style.transform = "scale(" + scale + ")";
}

function signOf(kind) {
	if (kind === "add") return "+";
	if (kind === "del") return "-";
	return " ";
}

// order is the marker number a firing tenet carries, 1 upwards in the order
// the bars fire, so the number on a row and the number in the left pane's
// gutter are the same one.
function markerOrder(rows) {
	const order = new Map();
	let n = 0;
	for (const row of rows) {
		if (row.p >= CUTOFF) {
			n += 1;
			order.set(row.id, n);
		}
	}
	return order;
}

function renderLines(layer, lines, order, staggered) {
	layer.textContent = "";
	const rows = [];
	const textOnly = lines.length > 0 && lines[0].k === "plain";
	for (const line of lines) {
		const row = document.createElement("div");
		row.className = "row " + line.k + (textOnly ? " text-only" : "") + (staggered ? "" : " in");
		if (line.hit) row.dataset.hit = line.hit;

		const marker = document.createElement("div");
		marker.className = "marker";
		marker.dataset.shown = "0";
		if (line.hit && order.has(line.hit)) marker.textContent = String(order.get(line.hit));
		row.append(marker);

		if (!textOnly) {
			const sign = document.createElement("span");
			sign.className = "sign";
			sign.textContent = signOf(line.k);
			row.append(sign);
		}

		const text = document.createElement("span");
		text.className = "text";
		text.textContent = line.t;
		row.append(text);

		layer.append(row);
		rows.push(row);
	}
	return rows;
}

const bars = new Map();

function renderTenets(rows, order) {
	tenetsEl.textContent = "";
	tenetsEl.append(cutoffEl);
	bars.clear();
	for (const row of rows) {
		const el = document.createElement("div");
		el.className = "tenet";

		const label = document.createElement("div");
		label.className = "label";
		const marker = document.createElement("div");
		marker.className = "marker";
		marker.dataset.shown = "0";
		if (order.has(row.id)) marker.textContent = String(order.get(row.id));
		const id = document.createElement("span");
		id.className = "id";
		id.textContent = row.id;
		const gloss = document.createElement("span");
		gloss.className = "gloss";
		gloss.textContent = GLOSS[row.id];
		label.append(marker, id, gloss);

		const track = document.createElement("div");
		track.className = "track";
		const fill = document.createElement("div");
		fill.className = "fill";
		const value = document.createElement("span");
		value.className = "value";
		track.append(fill, value);

		const at = document.createElement("div");
		at.className = "at";

		el.append(label, track, at);
		tenetsEl.append(el);
		bars.set(row.id, { el: el, fill: fill, value: value, at: at, marker: marker });
	}
}

function money(usd) {
	return "$" + usd.toFixed(5);
}

function setHeadline(lead, tail, tone) {
	headlineEl.textContent = "";
	const first = document.createElement("span");
	first.textContent = lead;
	headlineEl.append(first);
	if (tail) {
		const span = document.createElement("span");
		span.className = "tail " + tone;
		span.textContent = " " + tail;
		headlineEl.append(span);
	}
}

function setSubline(act, findings) {
	const calls = act.blocked.windows === 1 ? "one jev call" : "one jev call per window";
	const head = findings === null
		? "judged against " + act.source
		: findings + (findings === 1 ? " finding from " : " findings from ") + act.source;
	sublineEl.textContent = head + " · " + calls + " · cutoff 0.80";
}

function setStrip(stats) {
	stripEl.textContent = stats.input_tokens.toLocaleString("en-US") + " tokens · " +
		stats.calls + (stats.calls === 1 ? " call · " : " calls · ") +
		stats.windows + (stats.windows === 1 ? " window" : " windows");
}

function seconds(ms) {
	return (ms / 1000).toFixed(1) + " s";
}

function setBar(row, duration) {
	const bar = bars.get(row.id);
	const p = row.p;
	const over = p >= CUTOFF;
	const pct = (p * 100).toFixed(1).replace(/\.0$/, "") + "%";

	bar.fill.style.setProperty("--bar-dur", (reduced ? 1 : duration) + "ms");
	bar.value.style.setProperty("--bar-dur", (reduced ? 1 : duration) + "ms");
	bar.fill.style.width = pct;
	bar.value.style.left = pct;
	bar.value.textContent = p.toFixed(2);
	bar.value.classList.toggle("inside", p >= 0.7);
	bar.el.classList.toggle("over", over);
	bar.at.textContent = over ? row.at : "";
	bar.marker.dataset.shown = over ? "1" : "0";
}

function light(id) {
	const line = blockedLayer.querySelector('[data-hit="' + id + '"]');
	if (!line) return;
	line.classList.add("hit");
	const marker = line.querySelector(".marker");
	if (marker) marker.dataset.shown = "1";
}

const SESSION_LINES = 3;
let sessionCount = 0;

// The strip holds a whole session and shows its last three lines, so the older
// ones scroll up as the agent works. A prompt line is typed a character at a
// time; everything else arrives whole, the way a tool's output does.
function say(line) {
	const el = document.createElement("div");
	el.className = "line " + line.kind;
	el.textContent = line.kind === "prompt" ? "" : line.t;
	sessionEl.append(el);
	sessionCount += 1;
	const over = Math.max(0, sessionCount - SESSION_LINES);
	sessionEl.style.transform = "translateY(" + -over * 24 + "px)";
	return el;
}

function typeInto(el, text, start) {
	for (let i = 1; i <= text.length; i++) {
		const shown = text.slice(0, i);
		at(start + i * T.TYPE_MS, function () {
			el.textContent = shown;
		});
	}
}

let timers = [];
let started = 0;

// ms is measured from the first frame, whenever at() is called: a beat
// scheduled from inside another beat, such as the typing or the left pane
// opening line by line, lands where the timeline says rather than that beat's
// own moment plus the offset.
function at(ms, fn) {
	const delay = Math.max(0, T.PRE + ms - (Date.now() - started));
	timers.push(setTimeout(fn, delay));
}

// The counter is stepped rather than driven by a frame loop, so the clip reads
// the same on a slow recorder and the timeline stays checkable.
function countTo(start, span, ms) {
	for (let i = 0; i <= T.COUNT_TICKS; i++) {
		const value = (ms / 1000) * (i / T.COUNT_TICKS);
		at(start + Math.round((span * i) / T.COUNT_TICKS), function () {
			counterEl.textContent = value.toFixed(2) + " s";
		});
	}
}

function scheduleAct(act, start) {
	const off = offsets(act);
	const order = markerOrder(act.rows);
	const barsAt = start + off.bars;
	const verdictAt = barsEnd(act, barsAt) + T.VERDICT_GAP;
	const rebarsAt = start + off.rebars;
	const passAt = barsEnd(act, rebarsAt) + T.VERDICT_GAP;

	const sessionAt = {
		open: start + off.textIn,
		verdict: verdictAt,
		caption: start + off.caption,
		again: rebarsAt - T.TYPE_LEAD,
		pass: passAt
	};
	for (const line of act.session) {
		const when = sessionAt[line.when];
		at(when, function () {
			const el = say(line);
			if (line.kind === "prompt") typeInto(el, line.t, when);
		});
	}

	// The act opens: its own two states go into the panes, the left one line
	// at a time.
	at(start, function () {
		setHeadline(act.lead, "", "");
		setSubline(act, null);
		fileMetaEl.textContent = act.meta;
		counterEl.textContent = "0.00 s";
		costEl.textContent = "";
		clockCaptionEl.textContent = "seconds, this " + act.unit;
		setStrip(act.blocked);
		statusEl.textContent = "";
		statusEl.className = "";
		blockedLayer.dataset.state = "shown";
		passedLayer.dataset.state = "hidden";
		const rows = renderLines(blockedLayer, act.left, order, true);
		renderLines(passedLayer, act.fixedLeft, new Map(), false);
		renderTenets(act.rows, order);
		rows.forEach(function (row, i) {
			at(start + off.textIn + i * off.stagger, function () {
				row.classList.add("in");
			});
		});
	});

	at(barsAt - 400, function () {
		statusEl.textContent = "asking jev…";
		statusEl.className = "";
	});
	countTo(barsAt, verdictAt - barsAt, act.blocked.duration_ms);

	act.rows.forEach(function (row, i) {
		const from = barsAt + i * T.BAR_STAGGER;
		at(from, function () {
			setBar(row, T.BAR_DUR);
		});
		if (row.p >= CUTOFF) {
			at(from + T.BAR_DUR, function () {
				light(row.id);
			});
		}
	});

	at(verdictAt, function () {
		setHeadline(act.lead, "Blocked in " + seconds(act.blocked.duration_ms) + ".", "bad");
		setSubline(act, act.blocked.findings);
		costEl.textContent = money(act.blocked.cost_usd) + " per " + act.unit;
		statusEl.textContent = "blocked · " + act.blocked.findings +
			(act.blocked.findings === 1 ? " finding" : " findings");
		statusEl.className = "bad";
	});

	at(start + off.caption, function () {
		statusEl.textContent = act.caption;
		statusEl.className = "note";
	});

	at(start + off.swap, function () {
		blockedLayer.style.setProperty("--fade", T.CARD_FADE + "ms");
		passedLayer.style.setProperty("--fade", T.CARD_FADE + "ms");
		blockedLayer.dataset.state = "hidden";
		passedLayer.dataset.state = "shown";
		fileMetaEl.textContent = act.fixedMeta;
	});

	at(rebarsAt - 400, function () {
		statusEl.textContent = "asking jev…";
		statusEl.className = "";
		counterEl.textContent = "0.00 s";
		costEl.textContent = "";
	});
	countTo(rebarsAt, passAt - rebarsAt, act.passed.duration_ms);

	act.fixedRows.forEach(function (row, i) {
		at(rebarsAt + i * T.BAR_STAGGER, function () {
			setBar(row, T.BAR_DUR);
		});
	});

	at(passAt, function () {
		setHeadline(act.fixedLead, "Passed in " + seconds(act.passed.duration_ms) + ".", "good");
		setSubline(act, act.passed.findings);
		costEl.textContent = money(act.passed.cost_usd) + " per " + act.unit;
		setStrip(act.passed);
		statusEl.textContent = "passed · 0 findings";
		statusEl.className = "good";
	});

	return { verdictAt: verdictAt, passAt: passAt };
}

function play() {
	for (const t of timers) clearTimeout(t);
	timers = [];
	started = Date.now();

	blackoutEl.dataset.shown = "1";
	cardEl.dataset.shown = "0";
	sessionEl.textContent = "";
	sessionEl.style.transform = "translateY(0)";
	sessionCount = 0;
	progressEl.style.transition = "none";
	progressEl.style.width = "0";

	const marks = [];
	ACTS.forEach(function (act, i) {
		marks.push(scheduleAct(act, T.AT[i]));
	});

	at(0, function () {
		blackoutEl.dataset.shown = "0";
		progressEl.style.transition = "width " + (TOTAL - T.PRE) + "ms linear";
		progressEl.style.width = "100%";
	});

	at(T.END, function () {
		cardEl.style.setProperty("--card-fade", T.CARD_FADE + "ms");
		cardEl.dataset.shown = "1";
	});

	at(T.END + T.CARD_HOLD, function () {
		blackoutEl.dataset.shown = "1";
	});

	return marks;
}

cutoffEl.style.left = (CUTOFF * 100).toFixed(1).replace(/\.0$/, "") + "%";
fit();
window.addEventListener("resize", fit);
window.addEventListener("keydown", function (e) {
	if (e.code === "Space" || e.key === " ") {
		e.preventDefault();
		play();
	}
});
window.addEventListener("click", play);
const marks = play();
console.log("demo/index.html: acts at " + T.AT.map(function (ms) { return (T.PRE + ms) / 1000; }).join(", ") +
	" s, end card at " + (T.PRE + T.END) / 1000 + " s, " + (TOTAL / 1000).toFixed(1) + " s in all");
console.log("verdicts at " + marks.map(function (m) { return (T.PRE + m.verdictAt) / 1000; }).join(", ") +
	" s, passes at " + marks.map(function (m) { return (T.PRE + m.passAt) / 1000; }).join(", ") + " s");
</script>
</body>
</html>
