<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tenet · every commit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
	--plane: #0a0a09;
	--surface: #16161a;
	--pane: #101014;
	--black: #000000;
	--ink: #f4f4ef;
	--ink-2: #c3c2b7;
	/* --muted clears 4.5:1 on --pane, which the 16px text it carries needs at
	   the size this clip is watched. */
	--muted: #8b8a82;
	--hairline: rgba(244, 244, 239, 0.10);
	--rail: rgba(244, 244, 239, 0.06);
	--grid: #3a3a37;
	/* Two reds, because one cannot do both jobs: --fail is what a marker, a bar
	   and a hit line's rule are filled with, and --fail-text is red set as
	   text, which --fail misses 4.5:1 for. */
	--fail: #d03b3b;
	--fail-text: #ef6b6b;
	--fail-wash: rgba(208, 59, 59, 0.16);
	--fail-tint: rgba(208, 59, 59, 0.07);
	--fail-ink: #f6d0d0;
	--on-fail: #ffffff;
	--pass: #3fb950;
	--quiet-bar: #4a6f8f;
	--add-wash: rgba(63, 185, 80, 0.07);
	--add-ink: #a8d8ae;
	/* Claude Code's own dots: amber for a tool call, green for the agent. */
	--tool-dot: #d4a72c;
	--agent-dot: #3fb950;

	--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;

	/* One type scale, and nothing on the stage is set below --t-xs: at the two
	   fifths of full size a recording is watched at, smaller stops being read. */
	--t-xs: 16px;
	--t-s: 18px;
	--t-m: 20px;
	--t-l: 24px;
	--t-xl: 32px;
	--t-num: 42px;

	/* One rhythm, of 4px. Every padding, gap and margin is one of these. */
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;

	--line: 22px;
	--ease: cubic-bezier(0.22, 0.61, 0.36, 1);
	--fast: 200ms;
	--base: 300ms;
	--slow: 700ms;
}

/* Anything whose words change does it by fading out, swapping and fading back
   in, so nothing on the page snaps from one state to the next. */
.xfade { transition: opacity var(--base) var(--ease); }
.xfade[data-vis="0"] { opacity: 0; transition-duration: var(--fast); }

@keyframes asking {
	from { opacity: 0.6; }
	to { opacity: 1; }
}

* { box-sizing: border-box; }

html, body {
	height: 100%;
	margin: 0;
}

body {
	background: var(--plane);
	color: var(--ink);
	font-family: var(--sans);
	display: flex;
	align-items: center;
	justify-content: center;
	overflow: hidden;
}

/* The stage is exactly the frame a 720p recording captures; it only ever
   scales down, so a smaller window previews the same composition. Every size
   in here is set for a viewer watching that frame about 500px wide. */
#stage {
	position: relative;
	width: 1280px;
	height: 720px;
	/* The code is shown as the file has it: no ligature joins != or := into
	   one glyph. */
	font-feature-settings: "liga" 0, "calt" 0;
	flex: 0 0 auto;
	transform-origin: center center;
	background: var(--surface);
	border: 1px solid var(--hairline);
	border-radius: var(--s3);
	display: grid;
	grid-template-rows: 52px 88px 1fr 112px 40px;
	overflow: hidden;
}

header {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: var(--s4);
	padding: var(--s3) var(--s5) 0;
	border-bottom: 1px solid var(--hairline);
}

header .brand {
	font-size: var(--t-m);
	font-weight: 600;
	letter-spacing: -0.01em;
	color: var(--ink);
	margin-right: var(--s3);
}

header .tagline { font-size: var(--t-xs); color: var(--muted); }
header .repo { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); }
header .left { display: flex; align-items: baseline; }

.headline {
	padding: var(--s3) var(--s5);
	display: flex;
	flex-direction: column;
	justify-content: center;
	gap: var(--s1);
	border-bottom: 1px solid var(--hairline);
}

#headline {
	font-size: var(--t-xl);
	font-weight: 600;
	line-height: 40px;
	letter-spacing: -0.015em;
	margin: 0;
	color: var(--ink);
}

#headline .tail.bad { color: var(--fail-text); }
#headline .tail.good { color: var(--pass); }

#subline {
	font-family: var(--mono);
	font-size: var(--t-xs);
	line-height: 20px;
	color: var(--muted);
	margin: 0;
}

/* The left column holds 76 columns of JetBrains Mono at 16px once the pane's
   inset and a row's gutter are taken out. The face advances 9.6px a glyph,
   but Chrome on Linux rounds that to a whole 10px, so the column is 760px;
   every line of the two patches that a finding lands on or sits beside is 74
   columns or fewer. The right column is what is left, and its widest line is
   a tenet id at 18px beside its marker. */
main {
	display: grid;
	grid-template-columns: 888px 1fr;
	min-height: 0;
	transition: opacity var(--base) var(--ease);
}

main[data-vis="0"] { opacity: 0; }

.pane {
	padding: var(--s3) var(--s5);
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s3);
}

.pane.left { border-right: 1px solid var(--hairline); background: var(--pane); }

/* The body is cut at its edge: it holds 18 rows of --line, and check.js holds
   every act to that many, so nothing it shows can run on into the session. */
.body {
	position: relative;
	flex: 1 1 auto;
	min-height: 0;
	overflow: hidden;
	font-family: var(--mono);
	font-size: var(--t-xs);
	line-height: var(--line);
	tab-size: 2;
}

.layer {
	position: absolute;
	inset: 0;
	transition: opacity var(--fade, var(--slow)) var(--ease);
}

.layer[data-state="hidden"] { opacity: 0; }

/* A row is the file's own line under its own number: a marker column, the
   number, then the text, which is verbatim. A line longer than the text
   column would wrap onto a second row under its number rather than be cut,
   and check.js counts it twice against the pane; none does today. Rows align
   at their top rather than their baseline, because an empty marker has no
   baseline to give and would push its row taller than --line. */
.row {
	display: grid;
	grid-template-columns: var(--s5) var(--s5) 1fr;
	column-gap: var(--s3);
	align-items: start;
	min-height: var(--line);
	/* The rule a hit line carries is part of its 8px inset, so a line does not
	   move sideways when it lights up. */
	border-left: 2px solid transparent;
	padding-left: calc(var(--s2) - 2px);
	opacity: 0;
	transform: translateY(var(--s1));
	transition: opacity var(--base) var(--ease), transform var(--base) var(--ease);
}

.row.in { opacity: 1; transform: none; }

.row .num {
	color: var(--muted);
	text-align: right;
	font-variant-numeric: tabular-nums;
}

.row .text {
	color: var(--ink-2);
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}

.row.file .text { color: var(--ink); font-weight: 700; }
.row.file .stat { color: var(--muted); font-weight: 400; }
.row.add { background: var(--add-wash); }
.row.add .text { color: var(--add-ink); }

.row.hit {
	background: var(--fail-wash);
	border-left-color: var(--fail);
	transition: opacity var(--fast) var(--ease), background var(--base) var(--ease), border-color var(--base) var(--ease);
}

.row.hit .text { color: var(--fail-ink); }

.marker {
	width: var(--line);
	height: var(--line);
	border-radius: 50%;
	background: var(--fail);
	color: var(--on-fail);
	font-family: var(--mono);
	font-size: var(--t-xs);
	font-weight: 700;
	line-height: var(--line);
	text-align: center;
	opacity: 0;
	transition: opacity var(--base) var(--ease);
}

.marker[data-shown="1"] { opacity: 1; }

.clock { display: flex; flex-direction: column; }

/* Two stats of the same shape, a number over its caption. They line up on the
   captions rather than the numbers, which are set at different sizes. */
.clock .top {
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: var(--s4);
}

.clock .stat { display: flex; flex-direction: column; }
.clock .stat.cost { align-items: flex-end; text-align: right; }

#counter {
	font-family: var(--mono);
	font-size: var(--t-num);
	font-weight: 700;
	line-height: 48px;
	color: var(--ink);
	font-variant-numeric: tabular-nums;
}

#cost {
	font-family: var(--mono);
	font-size: var(--t-m);
	line-height: 28px;
	color: var(--ink-2);
	font-variant-numeric: tabular-nums;
}

.clock .caption {
	font-size: var(--t-xs);
	line-height: 20px;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	color: var(--muted);
}

/* The four tenets fill what is left between the clock and the status line:
   four rows of 60px with 12px between them, in 284px. A row is the marker and
   the id, the gloss under them, then the bar; where the finding landed is in
   the left pane's gutter, on the numbered line itself, so the row does not
   say it again. */
.tenets {
	position: relative;
	flex: 1 1 auto;
	display: flex;
	flex-direction: column;
	justify-content: center;
	gap: var(--s3);
}

.tenet {
	margin: 0 calc(-1 * var(--s2));
	padding: 0 var(--s2);
	border-radius: var(--s1);
	background: transparent;
	transition: background var(--base) var(--ease);
}

.tenet.over { background: var(--fail-tint); }

.tenet .label {
	display: flex;
	align-items: center;
	gap: var(--s2);
	height: var(--line);
}

.tenet .id {
	font-family: var(--mono);
	font-size: var(--t-s);
	line-height: var(--line);
	color: var(--ink-2);
	flex: 0 0 auto;
	transition: color var(--base) var(--ease);
}

.tenet .gloss {
	font-size: var(--t-xs);
	line-height: var(--line);
	height: var(--line);
	padding-left: calc(var(--line) + var(--s2));
	color: var(--muted);
	white-space: nowrap;
}

.tenet.over .id { color: var(--ink); font-weight: 500; }

.track {
	position: relative;
	height: var(--s4);
	background: var(--rail);
	border-radius: 2px;
}

/* --bar-dur is a beat of the clip rather than a duration of the interface: the
   script sets it to how long the bars take to run. */
.fill {
	height: 100%;
	width: 0;
	background: var(--quiet-bar);
	border-radius: 0 var(--s1) var(--s1) 0;
	transition: width var(--bar-dur, 800ms) var(--ease), background-color var(--base) var(--ease);
}

.tenet.over .fill { background: var(--fail); }

.value {
	position: absolute;
	top: 0;
	left: 0;
	transform: translateX(var(--s2));
	font-family: var(--mono);
	font-size: var(--t-xs);
	line-height: var(--s4);
	color: var(--muted);
	font-variant-numeric: tabular-nums;
	opacity: 0;
	transition: left var(--bar-dur, 800ms) var(--ease), opacity var(--base) var(--ease);
}

.value[data-vis="1"] { opacity: 1; }

.tenet.over .value { color: var(--ink); }

/* Past three quarters of the track the tip label would run off the pane, so it
   sits inside the bar end, against the fill. */
.value.inside {
	transform: translateX(-100%) translateX(calc(-1 * var(--s2)));
	color: var(--on-fail);
}

/* One cutoff for every bar, at the same place on every track, so the rows are
   read against a single scale. The subline names it, so the mark carries no
   label of its own. */
.cut {
	position: absolute;
	top: calc(-1 * var(--s1));
	bottom: calc(-1 * var(--s1));
	width: 1px;
	background: var(--grid);
	pointer-events: none;
}

/* One size and one weight in every state; the colour is what says which state
   the run is in. It never wraps, so every line it shows is written to fit the
   column, which check.js measures. */
#status {
	font-size: var(--t-l);
	font-weight: 600;
	line-height: 28px;
	height: 28px;
	white-space: nowrap;
	color: var(--muted);
	transition: color var(--fast) var(--ease);
}

#status.bad { color: var(--fail-text); }
#status.good { color: var(--pass); }
#status.note { color: var(--ink-2); }
#status.asking { animation: asking 1.2s var(--ease) infinite alternate; }

footer {
	border-top: 1px solid var(--hairline);
	padding: 0 var(--s5);
	display: flex;
	align-items: center;
}

#strip {
	font-family: var(--mono);
	font-size: var(--t-xs);
	color: var(--muted);
	font-variant-numeric: tabular-nums;
}

.session {
	border-top: 1px solid var(--hairline);
	background: var(--pane);
	padding: var(--s3) var(--s5);
}

/* The strip shows four lines and clips at their edge, not at the padding's,
   so a line scrolling off the top is gone rather than left showing in the
   inset above the first line. */
#session {
	height: calc(4 * var(--line));
	overflow: hidden;
	font-family: var(--mono);
	font-size: var(--t-xs);
	line-height: var(--line);
}

#session .lines { transition: transform var(--base) var(--ease); }

/* A line is a flex row, so the typed turn's box, which is inline-block and
   would otherwise sit on the baseline and stretch the line box past --line,
   leaves the line exactly one row tall. */
#session .line {
	display: flex;
	align-items: center;
	height: var(--line);
	white-space: pre;
	color: var(--ink-2);
	opacity: 0;
	transform: translateY(var(--s1));
	transition: opacity var(--base) var(--ease), transform var(--base) var(--ease);
}

#session .line.in { opacity: 1; transform: none; }

#session .box {
	display: inline-block;
	height: var(--line);
	line-height: 20px;
	padding: 0 var(--s2);
	border: 1px solid var(--hairline);
	border-radius: var(--s1);
	color: var(--ink);
}

#session .dot { color: var(--tool-dot); }
#session .line.agent .dot { color: var(--agent-dot); }
#session .name { color: var(--ink); font-weight: 700; }
#session .arg { color: var(--muted); }
#session .line.agent .text { color: var(--ink); }
#session .line.result { color: var(--fail-text); }
#session .line.result.good { color: var(--pass); }

/* Black after the last frame, so the cut point at the end is clean; the clip
   opens on the stage itself. A hairline along the bottom edge says how much
   of the clip is left to record. */
#blackout {
	position: absolute;
	inset: 0;
	background: var(--black);
	pointer-events: none;
	transition: opacity var(--fast) var(--ease);
}

#blackout[data-shown="0"] { opacity: 0; }

#progress {
	position: absolute;
	left: 0;
	bottom: 0;
	height: var(--s1);
	width: 0;
	background: var(--grid);
	pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
	main, .xfade, .layer, .fill, .value, .row, .row.hit, .marker, .tenet, .tenet .id, #status, #session .lines, #session .line, #blackout {
		transition-duration: 1ms;
	}

	#status.asking { animation: none; }
}
</style>
</head>
<body>
<div id="stage">
	<header>
		<span class="left"><span class="brand">tenet</span><span class="tagline">the review gate for code that agents write</span></span>
		<span class="repo">github.com/zoidsh/tenet</span>
	</header>

	<div class="headline">
		<p id="headline" class="xfade"></p>
		<p id="subline" class="xfade"></p>
	</div>

	<main id="main">
		<section class="pane left">
			<div class="body">
				<div class="layer" id="layer-blocked"></div>
				<div class="layer" id="layer-passed" data-state="hidden"></div>
			</div>
		</section>

		<section class="pane right">
			<div class="clock">
				<div class="top">
					<div class="stat">
						<span id="counter">0.00 s</span>
						<span class="caption xfade" id="clock-caption"></span>
					</div>
					<div class="stat cost xfade" id="coststat" data-vis="0">
						<span id="cost"></span>
						<span class="caption" id="cost-caption">cost</span>
					</div>
				</div>
			</div>
			<div class="tenets" id="tenets"></div>
			<div id="status" class="xfade"></div>
		</section>
	</main>

	<div class="session"><div id="session"><div class="lines" id="session-lines"></div></div></div>

	<footer><span id="strip" class="xfade"></span></footer>

	<div id="progress"></div>
	<div id="blackout" data-shown="0"></div>
</div>

<script>
// Every id, path, line number and number below is copied out of demo/data: six
// runs of the sample project in demo/sample against its own tenet.yml,
// measured on 2026-09-18 with an empty cache. A run prints a probability only
// for a finding or for a near miss within 0.2 of its cutoff, so the numbers
// under 0.80 were read off the same cached answers by moving the cutoff, which
// is cutoff-sweep.txt. Where a tenet was asked about two windows, p is the
// higher of its two answers, which is the one its verdict rests on. Each gloss
// is the rule's own sentence in a handful of words, from rules/<id>/rule.yml
// and, for money-in-cents, demo/sample/tenet.yml.
const GLOSS = {
	"comment-why": "a comment says why, not what",
	"no-mocking": "tests use the real dependency",
	"no-fallback": "no silent fallback, raise the error",
	"money-in-cents": "money is integer cents, not a float",
	"subject-says-what-changed": "not the files touched",
	"body-says-why": "the description gives the why",
	"body-states-door": "says how far it walks back",
	"body-few-visuals": "one or two visuals, no more"
};

// The code act's four rows are the four that fire, which is what the frame has
// room for. The three of agent-hygiene left out stayed well under the cutoff
// in both runs: no-transcript-comment at 0.11 and 0.09, no-placeholder-phrase
// and assertion-justified at or under 0.11 in each.
const CODE_BLOCKED = [
	{ id: "no-fallback", p: 0.94 },
	{ id: "money-in-cents", p: 0.95 },
	{ id: "comment-why", p: 0.88 },
	{ id: "no-mocking", p: 0.89 }
];

const CODE_PASSED = [
	{ id: "no-fallback", p: 0.36 },
	{ id: "money-in-cents", p: 0.09 },
	{ id: "comment-why", p: 0.13 },
	{ id: "no-mocking", p: 0.35 }
];

// The left pane shows files: a name row, then the file's own lines under
// their own numbers, verbatim, and check.js reads them back out of the
// patches. `hit` names the tenet whose finding the run put on that line, and
// `add` marks the lines the patch adds, all of them in the blocked state and
// only the ones the fix touched in the passed state, which is what the
// crossfade then shows.
function file(name, stat) {
	return { k: "file", t: name, stat: stat };
}

function lines(from, texts, opts) {
	const hit = (opts && opts.hit) || {};
	const add = opts && opts.add;
	return texts.map(function (t, i) {
		const n = from + i;
		const line = { k: "line", n: n, t: t };
		if (hit[n]) line.hit = hit[n];
		if (add === true || (Array.isArray(add) && add.indexOf(n) >= 0)) line.add = true;
		return line;
	});
}

// demo/sample/agent-change.patch as staged: billing.go from ParseDiscount to
// the end of the file, and the one line of billing_test.go a finding names.
const CODE_LEFT_BLOCKED = [
	file("billing.go", "+29"),
	...lines(22, [
		"func ParseDiscount(code string) Discount {",
		"\tpercent, err := strconv.ParseFloat(strings.TrimPrefix(code, \"SAVE\"), 64)",
		"\tif err != nil {",
		"\t\t// default to 0 on a parse error so that checkout keeps working",
		"\t\tpercent = 0",
		"\t}",
		"\treturn Discount{Code: code, Percent: percent}",
		"}",
		"",
		"func DiscountedTotal(totalCents int, discount Discount) float64 {",
		"\t// divide the cents by 100 to get dollars",
		"\tdollars := float64(totalCents) / 100",
		"\t// take the percent off the dollars",
		"\treturn dollars - dollars*discount.Percent/100",
		"}"
	], { add: true, hit: { 26: "no-fallback", 31: "money-in-cents", 32: "comment-why" } }),
	file("billing_test.go", "+23"),
	...lines(36, [
		"\trepo := stubRepository{invoice: Invoice{"
	], { add: true, hit: { 36: "no-mocking" } })
];

// The same two files after demo/sample/agent-fix.patch, the same two windows.
const CODE_LEFT_PASSED = [
	file("billing.go", "+10 −11"),
	...lines(23, [
		"func ParseDiscount(code string) (Discount, error) {",
		"\tpercent, err := strconv.Atoi(strings.TrimPrefix(code, \"SAVE\"))",
		"\tif err != nil {",
		"\t\treturn Discount{}, fmt.Errorf(\"discount code %q: %w\", code, err)",
		"\t}",
		"\treturn Discount{Code: code, Percent: percent}, nil",
		"}",
		"",
		"// Rounding goes to the house: half a cent of discount is dropped rather",
		"// than given away, because the ledger reconciles in whole cents.",
		"func DiscountedTotalCents(totalCents int, discount Discount) int {",
		"\treturn totalCents - totalCents*discount.Percent/100",
		"}"
	], { add: [23, 24, 26, 28, 31, 32, 33, 34] }),
	file("billing_test.go", "+12 −15"),
	...lines(28, [
		"\trepo := NewMemoryRepository(Invoice{"
	], { add: [28] })
];

// demo/sample/commit-msg-bad.txt and commit-msg-good.txt, line for line. The
// finding lands on COMMIT_EDITMSG:1.
const COMMIT_BAD = [
	file("COMMIT_EDITMSG"),
	...lines(1, [
		"Update billing.go and billing_test.go"
	], { hit: { 1: "subject-says-what-changed" } })
];

const COMMIT_GOOD = [
	file("COMMIT_EDITMSG"),
	...lines(1, [
		"Add discount codes, rounding half cents to the house",
		"",
		"The sales team keyed discounted totals in by hand, and",
		"that is where most invoice corrections came from."
	])
];

// demo/sample/pr-bad.txt and pr-good.txt, line for line. The findings land on

// Three acts, in milliseconds. The clip opens on the stage, with no black
// before it, and POST is the black hold at the end that gives the recording a
// clean cut point; AT is where each act starts and act.off holds its beats,
// measured from its own start. Those numbers are the holds read
// back: the left pane is fully in a second before jev is asked, a verdict
// stands for four seconds in the code act and three in the other two, the
// caption shows for 1.2 s, the swapped text is in for a second before the bars
// re-run, and a pass holds for 3.08 s, which is where the next act's round
// number falls, and for 3.5 s at the end.
const T = {
	PRE: 0,
	POST: 400,
	AT: [0, 16000, 28600],
	END_HOLD: 3500,
	// FADE, MAIN_FADE and OUT are --slow, --base and --fast: the script holds
	// the same three durations the stylesheet transitions on.
	FADE: 700,
	MAIN_FADE: 300,
	// A frame before the act starts, by which point the main area's fade-out
	// has run, is when the two layers are emptied.
	BLANK: 16,
	ASK_LEAD: 400,
	BAR_STAGGER: 200,
	BAR_DUR: 800,
	VERDICT_GAP: 120,
	COUNT_TICKS: 40,
	TYPE_MS: 35,
	TYPE_LEAD: 800,
	OUT: 200
};

const CUTOFF = 0.8;
const CUTOFF_LEFT = (CUTOFF * 100).toFixed(1).replace(/\.0$/, "") + "%";

function barsEnd(act, start) {
	return start + (act.rows.length - 1) * T.BAR_STAGGER + T.BAR_DUR;
}

const LAST = ACTS[ACTS.length - 1];
const END = barsEnd(LAST, T.AT[T.AT.length - 1] + LAST.off.rebars) + T.VERDICT_GAP + T.END_HOLD;
const TOTAL = T.PRE + END + T.POST;

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const stage = document.getElementById("stage");
const mainEl = document.getElementById("main");
const headlineEl = document.getElementById("headline");
const sublineEl = document.getElementById("subline");
const counterEl = document.getElementById("counter");
const costEl = document.getElementById("cost");
const costStatEl = document.getElementById("coststat");
const clockCaptionEl = document.getElementById("clock-caption");
const stripEl = document.getElementById("strip");
const statusEl = document.getElementById("status");
const tenetsEl = document.getElementById("tenets");
const blackoutEl = document.getElementById("blackout");
const progressEl = document.getElementById("progress");
const sessionEl = document.getElementById("session-lines");
const blockedLayer = document.getElementById("layer-blocked");
const passedLayer = document.getElementById("layer-passed");

function fit() {
	const scale = Math.min(1, window.innerWidth / 1280, window.innerHeight / 720);
	stage.style.transform = "scale(" + scale + ")";
}

// order is the marker number a firing tenet carries, 1 upwards in the order
// the bars fire, so the number on a row and the number in the left pane's
// gutter are the same one.
function markerOrder(rows) {
	const order = new Map();
	let n = 0;
	for (const row of rows) {
		if (row.p >= CUTOFF) {
			n += 1;
			order.set(row.id, n);
		}
	}
	return order;
}

function renderLines(layer, lines, order, staggered) {
	layer.textContent = "";
	const rows = [];
	for (const line of lines) {
		const row = document.createElement("div");
		row.className = "row " + line.k + (line.add ? " add" : "") + (staggered ? "" : " in");
		if (line.hit) row.dataset.hit = line.hit;
		if (line.k === "file") row.dataset.file = line.t;
		if (line.k === "line") row.dataset.line = String(line.n);

		const marker = document.createElement("div");
		marker.className = "marker";
		marker.dataset.shown = "0";
		if (line.hit && order.has(line.hit)) marker.textContent = String(order.get(line.hit));
		row.append(marker);

		const num = document.createElement("span");
		num.className = "num";
		num.textContent = line.k === "line" ? String(line.n) : "";
		row.append(num);

		const text = document.createElement("span");
		text.className = "text";
		text.textContent = line.t;
		if (line.stat) {
			const stat = document.createElement("span");
			stat.className = "stat";
			stat.textContent = " " + line.stat;
			text.append(stat);
		}
		row.append(text);

		layer.append(row);
		rows.push(row);
	}
	return rows;
}

const bars = new Map();

function renderTenets(rows, order) {
	tenetsEl.textContent = "";
	bars.clear();
	for (const row of rows) {
		const el = document.createElement("div");
		el.className = "tenet";

		const label = document.createElement("div");
		label.className = "label";
		const marker = document.createElement("div");
		marker.className = "marker";
		marker.dataset.shown = "0";
		if (order.has(row.id)) marker.textContent = String(order.get(row.id));
		const id = document.createElement("span");
		id.className = "id";
		id.textContent = row.id;
		label.append(marker, id);

		const gloss = document.createElement("div");
		gloss.className = "gloss";
		gloss.textContent = GLOSS[row.id];

		const track = document.createElement("div");
		track.className = "track";
		const fill = document.createElement("div");
		fill.className = "fill";
		const value = document.createElement("span");
		value.className = "value";
		const cut = document.createElement("span");
		cut.className = "cut";
		cut.style.left = CUTOFF_LEFT;
		track.append(fill, value, cut);

		el.append(label, gloss, track);
		tenetsEl.append(el);
		bars.set(row.id, { el: el, fill: fill, value: value, marker: marker });
	}
}

function money(usd) {
	return "$" + usd.toFixed(6);
}

// The number and its caption fade as one, so the caption is never left
// standing over a blank.
function setCostAt(usd, when) {
	at(when, function () {
		costStatEl.dataset.vis = "0";
	});
	at(when + T.OUT, function () {
		costEl.textContent = money(usd);
		costStatEl.dataset.vis = "1";
	});
}

// Everything readable changes the same way: out over T.OUT, swapped, back in.
// The time asked for is when the change starts, so the timeline reads as the
// beats it is written in.
function setTextAt(el, text, when, cls) {
	at(when, function () {
		el.dataset.vis = "0";
	});
	at(when + T.OUT, function () {
		el.textContent = text;
		if (cls !== undefined) el.className = "xfade " + cls;
		el.dataset.vis = "1";
	});
}

function setHeadlineAt(lead, tail, tone, when) {
	at(when, function () {
		headlineEl.dataset.vis = "0";
	});
	at(when + T.OUT, function () {
		setHeadline(lead, tail, tone);
		headlineEl.dataset.vis = "1";
	});
}

function setHeadline(lead, tail, tone) {
	headlineEl.textContent = "";
	const first = document.createElement("span");
	first.textContent = lead;
	headlineEl.append(first);
	if (tail) {
		const span = document.createElement("span");
		span.className = "tail " + tone;
		span.textContent = " " + tail;
		headlineEl.append(span);
	}
}

function sublineText(act, findings) {
	const head = findings === null
		? "judged against " + act.source
		: findings + (findings === 1 ? " finding from " : " findings from ") + act.source;
	return head + " · cutoff 0.80";
}

function stripText(stats) {
	return stats.input_tokens.toLocaleString("en-US") + " tokens · " +
		stats.calls + (stats.calls === 1 ? " call · " : " calls · ") +
		stats.windows + (stats.windows === 1 ? " window" : " windows");
}

// The headline tail shows what the counter it stopped is showing, so the two
// numbers on screen at that moment are the same number.
function seconds(ms) {
	return (ms / 1000).toFixed(2) + " s";
}

function setBar(row, duration) {
	const bar = bars.get(row.id);
	const p = row.p;
	const over = p >= CUTOFF;
	const pct = (p * 100).toFixed(1).replace(/\.0$/, "") + "%";

	bar.fill.style.setProperty("--bar-dur", (reduced ? 1 : duration) + "ms");
	bar.value.style.setProperty("--bar-dur", (reduced ? 1 : duration) + "ms");
	bar.fill.style.width = pct;
	bar.value.style.left = pct;
	bar.value.textContent = p.toFixed(2);
	bar.value.dataset.vis = "1";
	bar.value.classList.toggle("inside", p >= 0.7);
	bar.el.classList.toggle("over", over);
	bar.marker.dataset.shown = over ? "1" : "0";
}

function light(id) {
	const line = blockedLayer.querySelector('[data-hit="' + id + '"]');
	if (!line) return;
	line.classList.add("hit");
	const marker = line.querySelector(".marker");
	if (marker) marker.dataset.shown = "1";
}

const SESSION_LINES = 4;
let sessionCount = 0;

// The strip holds a whole session and shows its last four lines, so the older
// ones scroll up as the agent works. Only what a person types is typed: the
// turn they wrote. A tool call, its result and the agent's own line arrive
// whole, the way they do in a session.
function say(line) {
	const el = document.createElement("div");
	el.className = "line " + line.kind;
	let typed = null;

	if (line.kind === "user") {
		const box = document.createElement("span");
		box.className = "box";
		box.textContent = "> ";
		el.append(box);
		typed = box;
	} else if (line.kind === "tool") {
		const dot = document.createElement("span");
		dot.className = "dot";
		dot.textContent = "● ";
		const name = document.createElement("span");
		name.className = "name";
		name.textContent = line.name;
		const arg = document.createElement("span");
		arg.className = "arg";
		arg.textContent = "(" + line.arg + ")";
		el.append(dot, name, arg);
	} else if (line.kind === "agent") {
		const dot = document.createElement("span");
		dot.className = "dot";
		dot.textContent = "● ";
		const text = document.createElement("span");
		text.className = "text";
		text.textContent = line.t;
		el.append(dot, text);
	} else {
		el.textContent = "  ⎿  " + line.t;
	}

	sessionEl.append(el);
	sessionCount += 1;
	const over = Math.max(0, sessionCount - SESSION_LINES);
	sessionEl.style.transform = "translateY(" + -over * 22 + "px)";
	return { row: el, typed: typed };
}

function typePrefix(kind) {
	return kind === "user" ? "> " : "";
}

function typeInto(el, prefix, text, start) {
	for (let i = 1; i <= text.length; i++) {
		const shown = prefix + text.slice(0, i);
		at(start + i * T.TYPE_MS, function () {
			el.textContent = shown;
		});
	}
}

let timers = [];
let started = 0;

// ms is measured from the first frame, whenever at() is called: a beat
// scheduled from inside another beat, such as the typing or the left pane
// opening line by line, lands where the timeline says rather than that beat's
// own moment plus the offset.
function at(ms, fn) {
	const delay = Math.max(0, T.PRE + ms - (Date.now() - started));
	timers.push(setTimeout(fn, delay));
}

// The counter is stepped rather than driven by a frame loop, so the clip reads
// the same on a slow recorder and the timeline stays checkable.
function countTo(start, span, ms) {
	for (let i = 0; i <= T.COUNT_TICKS; i++) {
		const value = (ms / 1000) * (i / T.COUNT_TICKS);
		at(start + Math.round((span * i) / T.COUNT_TICKS), function () {
			counterEl.textContent = value.toFixed(2) + " s";
		});
	}
}

function scheduleAct(act, start) {
	const off = act.off;
	const order = markerOrder(act.rows);
	const barsAt = start + off.bars;
	const verdictAt = barsEnd(act, barsAt) + T.VERDICT_GAP;
	const rebarsAt = start + off.rebars;
	const passAt = barsEnd(act, rebarsAt) + T.VERDICT_GAP;

	const sessionAt = {
		open: start + off.textIn,
		call: barsAt - 600,
		verdict: verdictAt,
		caption: start + off.caption,
		again: rebarsAt - T.TYPE_LEAD,
		pass: passAt
	};
	for (const line of act.session) {
		const when = sessionAt[line.when];
		let el = null;
		at(when, function () {
			el = say(line);
			if (el.typed) typeInto(el.typed, typePrefix(line.kind), line.t, when);
		});
		at(when + 30, function () {
			if (el) el.row.classList.add("in");
		});
	}

	// The act opens behind a fade: the main area goes out, both layers are
	// emptied once it has gone, and it comes back in refilled, its left pane a
	// line at a time. Between those two moments neither act's text exists, so
	// nothing of the one just finished can be caught under the one arriving.
	if (start > 0) {
		at(start - T.MAIN_FADE, function () {
			mainEl.dataset.vis = "0";
		});
		at(start - T.BLANK, function () {
			blockedLayer.textContent = "";
			passedLayer.textContent = "";
		});
	}
	at(start, function () {
		counterEl.textContent = "0.00 s";
		costEl.textContent = "";
		costStatEl.dataset.vis = "0";
		clockCaptionEl.textContent = "this " + act.unit;
		clockCaptionEl.dataset.vis = "0";
		statusEl.textContent = "";
		statusEl.className = "xfade";
		// The crossfade belongs to the swap inside an act. Resetting the two
		// states here has to happen with no transition at all, or the layer
		// that was showing fades out over the act that is opening.
		blockedLayer.style.setProperty("--fade", "0ms");
		passedLayer.style.setProperty("--fade", "0ms");
		blockedLayer.dataset.state = "shown";
		passedLayer.dataset.state = "hidden";
		const rows = renderLines(blockedLayer, act.left, order, true);
		const fixedRows = renderLines(passedLayer, act.fixedLeft, new Map(), true);
		renderTenets(act.rows, order);
		mainEl.dataset.vis = "1";
		rows.forEach(function (row, i) {
			at(start + off.textIn + i * off.stagger, function () {
				row.classList.add("in");
			});
		});
		at(start + T.MAIN_FADE, function () {
			fixedRows.forEach(function (row) {
				row.classList.add("in");
			});
		});
	});
	setHeadlineAt(act.lead, "", "", start);
	setTextAt(sublineEl, sublineText(act, null), start);
	setTextAt(stripEl, stripText(act.blocked), start);
	at(start + T.OUT, function () {
		clockCaptionEl.dataset.vis = "1";
	});

	setTextAt(statusEl, "asking jev…", barsAt - T.ASK_LEAD, "asking");
	countTo(barsAt, verdictAt - barsAt, act.blocked.duration_ms);

	act.rows.forEach(function (row, i) {
		const from = barsAt + i * T.BAR_STAGGER;
		at(from, function () {
			setBar(row, T.BAR_DUR);
		});
		if (row.p >= CUTOFF) {
			at(from + T.BAR_DUR, function () {
				light(row.id);
			});
		}
	});

	setHeadlineAt(act.lead, "Blocked in " + seconds(act.blocked.duration_ms) + ".", "bad", verdictAt);
	setTextAt(sublineEl, sublineText(act, act.blocked.findings), verdictAt);
	setCostAt(act.blocked.cost_usd, verdictAt);
	setTextAt(statusEl, act.blocked.findings +
		(act.blocked.findings === 1 ? " finding · blocked" : " findings · blocked"), verdictAt, "bad");

	setTextAt(statusEl, act.caption, start + off.caption, "note");

	at(start + off.swap, function () {
		blockedLayer.style.setProperty("--fade", T.FADE + "ms");
		passedLayer.style.setProperty("--fade", T.FADE + "ms");
		blockedLayer.dataset.state = "hidden";
		passedLayer.dataset.state = "shown";
	});

	setTextAt(statusEl, "asking jev…", rebarsAt - T.ASK_LEAD, "asking");
	at(rebarsAt - T.ASK_LEAD, function () {
		counterEl.textContent = "0.00 s";
		costStatEl.dataset.vis = "0";
	});
	countTo(rebarsAt, passAt - rebarsAt, act.passed.duration_ms);

	act.fixedRows.forEach(function (row, i) {
		at(rebarsAt + i * T.BAR_STAGGER, function () {
			setBar(row, T.BAR_DUR);
		});
	});

	setHeadlineAt(act.fixedLead, "Passed in " + seconds(act.passed.duration_ms) + ".", "good", passAt);
	setTextAt(sublineEl, sublineText(act, act.passed.findings), passAt);
	setCostAt(act.passed.cost_usd, passAt);
	setTextAt(stripEl, stripText(act.passed), passAt);
	setTextAt(statusEl, "0 findings · passed", passAt, "good");

	return { verdictAt: verdictAt, passAt: passAt };
}

function play() {
	for (const t of timers) clearTimeout(t);
	timers = [];
	started = Date.now();

	blackoutEl.dataset.shown = "0";
	sessionEl.textContent = "";
	sessionEl.style.transform = "translateY(0)";
	sessionCount = 0;
	progressEl.style.transition = "none";
	progressEl.style.width = "0";

	const marks = [];
	ACTS.forEach(function (act, i) {
		marks.push(scheduleAct(act, T.AT[i]));
	});

	at(0, function () {
		progressEl.style.transition = "width " + (TOTAL - T.PRE) + "ms linear";
		progressEl.style.width = "100%";
	});

	at(END, function () {
		blackoutEl.dataset.shown = "1";
	});

	return marks;
}
