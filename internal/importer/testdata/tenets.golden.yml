# Criteria under a tenet, a true and a false description of what a violation looks like, sharpen its verdicts; see Configuration in the README.
version: 1
presets: [agent-hygiene]
tenets:
  - id: comment-says-why-code-exists
    tenet: A comment says why the code exists, not what it does.
    kind: [code]
    source: 'CLAUDE.md: A comment says why the code exists, not what it does.'
  - id: comment-says-why-written-way
    tenet: A comment says why it is written this way.
    kind: [code]
    source: 'AGENTS.md: A comment says why it is written this way.'
  - id: commit-subject-says-changed-reader
    tenet: The commit subject says what changed for a reader.
    kind: [commit]
    source: 'AGENTS.md: The commit subject says what changed for a reader.'
  - id: never-leave-branch-without-running
    tenet: Never leave a branch without running the tests.
    source: 'AGENTS.md: Never leave a branch without running the tests.'
