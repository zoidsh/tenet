    export function resolveLocale(requested: string | undefined, catalog: Catalog): string {
      if (requested === undefined) {
        return catalog.defaultLocale;
      }
      if (catalog.has(requested)) {
        return requested;
      }
      const base = requested.split("-")[0];
      if (catalog.has(base)) {
        return base;
      }
      // Falling back to the default locale is a product decision: a missing translation must never block rendering.
      return catalog.defaultLocale;
    }
