    func fetchWithRetry(ctx context.Context, c *http.Client, req *http.Request, attempts int) (*http.Response, error) {
    	var last error
    	for i := 0; i < attempts; i++ {
    		res, err := c.Do(req.Clone(ctx))
    		if err == nil && res.StatusCode < 500 {
    			return res, nil
    		}
    		if err == nil {
    			res.Body.Close()
    			err = fmt.Errorf("upstream status %d", res.StatusCode)
    		}
    		last = err
    		select {
    		case <-ctx.Done():
    			return nil, ctx.Err()
    		case <-time.After(backoff(i)):
    		}
    	}
    	return nil, fmt.Errorf("after %d attempts: %w", attempts, last)
    }
