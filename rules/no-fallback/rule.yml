id: no-fallback
tenet: "Do not add fallbacks, default-to-something-that-works-ish behavior, or silent degradation paths. Either the operation succeeds as intended, or it raises an actionable error."
criteria:
  true: "The code meets a failure or a missing required value and carries on with a substitute: a caught or suppressed exception followed by a default, an empty or cached result, an error value assigned to the blank identifier or otherwise discarded, a warning logged in place of a return, a required setting that becomes an empty string, a zero or a placeholder constant, or a keyed lookup whose default argument stands in for a value the result is computed from, such as a rate, an address or an identifier, as against an optional field the result merely carries. A blank, empty or zero stand-in for something the program cannot work without is a substitute however it is declared, and the caller cannot tell that anything went wrong."
  false: "Failures propagate, are re-raised, or are converted to an explicit error with context; or the value is a declared and usable default of an optional parameter, field or setting the operation does not require; or the function is selecting among values its input and its own data already offer, such as negotiating a locale against a catalogue that declares a default, where no call failed and every branch is a result the interface promises."
source: amd/gaia CLAUDE.md
# The highest an ok example scores is 0.39, the locale negotiation, so 0.75
# clears every acceptable case by 0.36. It is there for the required setting
# that becomes an empty string, which floats between 0.76 and 0.79 and so was
# caught or missed by the run. The zero tax rate sits under 0.75 as well and
# this does not reach it.
fail: 0.75
include: ["**/*.go"]
tags: [code, errors]
