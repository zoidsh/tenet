id: no-fallback
tenet: "Do not add fallbacks, default-to-something-that-works-ish behavior, or silent degradation paths. Either the operation succeeds as intended, or it raises an actionable error."
criteria:
  true: "The code meets a failure or a missing required value and carries on with a substitute: a caught or suppressed exception followed by a default, an empty or cached result, an error value assigned to the blank identifier or otherwise discarded, a warning logged in place of a return, a required setting that becomes an empty string, a zero or a placeholder constant, or a keyed lookup whose default argument stands in for a value the result is computed from, as against an optional field the result merely carries. A blank, empty or zero stand-in for something the program cannot work without is a substitute however it is declared, and the caller cannot tell that anything went wrong."
  false: "Failures propagate, are re-raised, or are converted to an explicit error with context; or the value is a declared and usable default of an optional parameter, field or setting the operation does not require; or the function is resolving an answer from candidates it was already handed, trying the caller's preference, then what its own table holds for the case in hand, then the default its configuration declares, where nothing was attempted and failed, no error was caught, dropped or logged, and every branch returns a value the interface promises. A preference order is not degradation: a substitute stands in for a value the program tried and failed to obtain, while the last branch of a selection is a value the program already had."
source: amd/gaia CLAUDE.md
include: ["**/*.go", "**/*.ts", "**/*.tsx", "**/*.py"]
kind: [code]
tags: [code, errors, standalone]
