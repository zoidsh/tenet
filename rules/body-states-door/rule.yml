id: body-states-door
tenet: "Describe whether it's a one-way or two-way door. You can walk back through two-way doors, but not one-way doors."
criteria:
  true: "Nothing in the description tells the reader how hard the change would be to walk back. It can be complete about the problem, the mechanism, the benchmarks and the tests it passed and still never reach the question of undoing it, and that absence is the fault whether or not it carries a merge, risk or danger heading; a general reassurance that the change is a mild one, graded or vouched for by how well it was checked, is the same absence dressed up, since it would read as true of any change at all. Or the door is named and left bare, the tenet's own terms standing as a label with nothing after them. Or the ground offered for the label re-asserts the label in other words, saying only that the change can or cannot be undone and adding no fact about this system that a reader could check. A time or a condition hung on the end of such a label leaves it a restatement, because it names neither the step that becomes final nor the circumstance that would force the reversal; the ground has to point at something in the change for the reader to weigh."
  false: "The description says how far the change can be walked back and what settles it, in the tenet's terms or in its own, and what it says takes one of two shapes. The change is reversible because nothing outside the process or the data was touched, or because a switch guards it. Or it is final because some step has put a thing beyond the reach of a revert: data, a published artifact, or an identifier or a name already handed out. A description that walks the reversible part back and names the one part that does not is stating the door, not failing to."
source: mattpocock/skills pr SKILL.md line 157
