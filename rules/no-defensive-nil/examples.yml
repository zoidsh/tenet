    export function parseFilters(params: URLSearchParams): Filters {
      const rawSince = params.get("since");
      if (rawSince === null) {
        return { since: DEFAULT_SINCE, status: "any", limit: DEFAULT_LIMIT };
      }
      const since = Date.parse(rawSince);
      if (Number.isNaN(since)) {
        throw new BadRequestError("since must be an ISO-8601 timestamp");
      }
      const status = params.get("status") ?? "any";
      if (!isStatus(status)) {
        throw new BadRequestError(`unknown status ${status}`);
      }
      const limit = Number(params.get("limit") ?? DEFAULT_LIMIT);
      return { since, status, limit: Math.min(limit, MAX_LIMIT) };
    }
