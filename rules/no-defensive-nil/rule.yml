id: no-defensive-nil
tenet: "Defensive `if x == nil { return nil }` in producer / projector / resolver paths is forbidden."
criteria:
  true: "The code checks a value for nil, null, None, undefined or emptiness and silently returns or skips, although the surrounding code already guarantees the value is present: the function itself just produced it with a New... constructor, a factory call, a new expression, an address taken of a local, or a literal; a collection was built with an element already in it on the line above, so it cannot be empty; a guard or a validator above has already returned or raised on it; the value was read or dereferenced above the check, so the function would have failed before ever reaching it; or its declared type does not admit null. It counts in each language's own spelling. In TypeScript, a parameter or local whose declared type includes neither null nor undefined, narrowed all the same by == null or === null, and equally an object the function just built with new tested for truthiness, which every object passes: the type has already forbidden the branch, so the compiler has answered the question the check asks. In Python, a falsiness test on a name that the lines above bound to a list literal with an element in it, which cannot then be empty. The branch is unreachable, and its only effect would be a silent return: nil with a nil error, None, an empty value, or nothing at all, which tells the caller neither a result nor a failure."
  false: "The nil check guards a value that can genuinely be absent at this point, such as a map or repository lookup, a pattern match, an optional field, or user input, or the check produces an explicit error rather than a silent return."
source: Kaikei-e/Alt CLAUDE.md
include: ["**/*.go", "**/*.ts", "**/*.tsx", "**/*.py"]
kind: [code]
tags: [code, errors, standalone]
