    # quiver

    quiver indexes a directory of Markdown files into a single BoltDB file and
    answers phrase queries against it from the command line. It holds the whole
    posting list in memory, so an index over more than about two million
    documents will not fit on a 16 GB machine.

    ## Install

        go install github.com/quiver/cmd/quiver@latest

    ## Usage

        quiver index ./corpus
        quiver search "release notes"
- label: ok
