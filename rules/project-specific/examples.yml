  code: |
    # Scheduling

    Each queue has a name, a concurrency limit and a retry policy. A job over
    the limit waits; a job that fails is retried with exponential backoff,
    doubling from one second up to the policy's maximum, and is then moved to
    the dead-letter queue.

    ## Priorities

    Priority is an integer from 0 to 9, where 0 runs first. Ties are broken by
    enqueue time, so a burst of equal-priority jobs runs in the order it
    arrived.

    ## Limits

    A queue holds at most 100000 pending jobs. Enqueueing past that returns
    `ErrQueueFull` rather than blocking.
