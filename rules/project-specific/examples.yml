  code: |
    # ledger

    ledger is a double-entry accounting library for Python.

    ## Install

        pip install ledger

    ## Usage

        from ledger import Book

        book = Book("2025")
        book.post("2025-01-03", debit="assets:bank", credit="income:sales",
                  amount="120.00")
        print(book.balance("assets:bank"))

    Amounts are `decimal.Decimal`; the library refuses a float, because a cent
    that rounds is a cent that disappears from a trial balance.
