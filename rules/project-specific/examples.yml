    # Scheduling

    The scheduler is a critical part of the system and has been carefully
    designed to deliver best-in-class performance at scale. Getting scheduling
    right is hard, and we have put a lot of thought into making it work well.

    ## Queues

    Each queue has a name, a concurrency limit and a retry policy. A job that
    exceeds the limit waits in the queue; a job that fails is retried with
    exponential backoff up to the policy's maximum.

    ## Priorities

    Priority is an integer from 0 to 9. Ties are broken by enqueue time.
