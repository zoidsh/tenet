  code: |
    # Why another migration tool

    It is fast because it never opens a connection per migration: it reads the
    whole directory, sorts by the numeric prefix, and runs the batch inside one
    transaction, so a hundred-file migration costs one round trip rather than a
    hundred.

    It is simple in one specific way: there is no down migration. Rolling back
    means writing a new forward migration, which is the only thing that
    survives a partially applied batch.

    ## Ordering

    The numeric prefix is the whole of the order. Two files that share a prefix
    are an error at load time, not a coin toss at run time.
