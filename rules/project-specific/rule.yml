id: project-specific
tenet: "Say what it does, not how it feels. The fix names the mechanism or a number. If the sentence could appear unchanged in another project's docs, it says nothing about this one. Cut it."
criteria:
  true: "A sentence rates the project instead of describing it. Its predicate is an evaluation of the software or a statement of the writer's intentions for it, and it rests on nothing a reader could check, so the same words would sit unchanged above any other tool of the same kind. Nothing in the sentence could be wrong, because it reports an estimate rather than a behaviour."
  false: "Every claim is anchored to something only this project has: a command, a flag or a configuration key; a format, a version or a limit; a measured quantity; the mechanism or the data structure behind a behaviour; a failure mode; or a system it reads or writes. A plain statement of what the project is, or of how to install it, is anchored too even in ordinary words."
source: cursor/plugins pstack/skills/unslop/SKILL.md #27
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs]
