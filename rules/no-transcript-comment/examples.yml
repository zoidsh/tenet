    def apply_migrations(conn, migrations):
        applied = read_applied(conn)
        for migration in migrations:
            if migration.id in applied:
                continue
            # The advisory lock has to be taken on the connection that runs the
            # DDL: a lock taken from the pool is released the moment the pooled
            # connection is handed back.
            with conn.advisory_lock(MIGRATION_LOCK):
                conn.execute(migration.sql)
                conn.execute(RECORD_MIGRATION, (migration.id, migration.checksum))
        return read_applied(conn)
