    export function scheduleFlush(queue: Queue, timers: Timers): Handle {
      // A browser clamps a timeout inside a background tab to one second, so a
      // shorter interval would only make the queue drain in bursts.
      const intervalMs = 1000;
      return timers.setInterval(() => {
        if (queue.size === 0) {
          return;
        }
        void queue.flush();
      }, intervalMs);
    }
