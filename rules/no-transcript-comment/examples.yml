    /**
     * Resolves the account a session belongs to.
     *
     * Throws SessionExpired once the session is past its expiry: a caller must
     * treat an expired session as a logout, never as an anonymous visitor.
     */
    export async function accountForSession(sessionId: string, db: Db): Promise<Account> {
      const session = await db.sessions.byId(sessionId);
      if (session === null) {
        throw new UnknownSession(sessionId);
      }
      if (session.expiresAt <= Date.now()) {
        throw new SessionExpired(sessionId);
      }
      return db.accounts.byId(session.accountId);
    }
