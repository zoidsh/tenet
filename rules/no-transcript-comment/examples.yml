    func (s *Store) Upsert(ctx context.Context, rows []Row) error {
    	// Postgres caps a statement at 65535 parameters and each row binds four
    	// of them, so a batch cannot grow past this.
    	const maxRows = 16000
    	if len(rows) > maxRows {
    		return fmt.Errorf("upsert of %d rows exceeds the %d a statement can bind", len(rows), maxRows)
    	}
    	stmt, args := buildUpsert(rows)
    	tag, err := s.pool.Exec(ctx, stmt, args...)
    	if err != nil {
    		return fmt.Errorf("upserting %d rows: %w", len(rows), err)
    	}
    	if tag.RowsAffected() != int64(len(rows)) {
    		return fmt.Errorf("upserted %d of %d rows", tag.RowsAffected(), len(rows))
    	}
    	return nil
    }
