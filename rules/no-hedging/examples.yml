    ## The index

    It could potentially be the case that a stale byte offset might, in some
    circumstances, end up pointing into the middle of another record rather
    than at the start of the one it names.

    The index stores a document id and a byte offset. A document rewritten in
    place keeps its id.

    ## Rebuilding

    Run `idx rebuild` after an in-place rewrite, or pass `--rewrite-safe` to
    the writer, which appends instead of overwriting.
- label: violation
