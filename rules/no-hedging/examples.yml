  code: |
    ## Writing the config

    `init` writes a `tenets.yml` in the directory you run it from. You may
    pass `--force` to replace one that is already there, and you may pass
    `--dry-run` to print the table and write nothing.

    ## What it reads

    Without `--from` it reads every instruction file the repository has.
    With `--from path` it reads exactly the files you name.

    An unreadable file named with `--from` is an error; one found by the
    default search is skipped with a line on stderr.
- label: ok
  lang: markdown
  code: |
    ## Timings

    A check over the sample corpus takes 2 to 6 seconds, depending on how
    many examples the cache already holds.

    The cache is keyed on the question, so a re-run after editing one
    tenet's criteria re-asks only that tenet's examples.

    ## Cost

    Each example is one call. `--runs 3` is three calls per example and
    leaves the cache out of it, so it costs three times as much.
- label: ok
  lang: markdown
  code: |
    # Workers

    A worker runs one job at a time. Run more processes to run more jobs;
    there is no thread pool inside a worker.

    A job that fails is retried three times and then moved to the
    dead-letter queue with its last error stored beside it.

    ## Draining

    `SIGTERM` finishes the current job and exits. A second `SIGTERM` exits
    at once and the lease expires 30 seconds later.
