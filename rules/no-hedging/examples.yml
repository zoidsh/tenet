  code: |
    # Architecture

    `gateway` terminates TLS and routes by Host header. `worker` pulls from
    the `jobs` stream in Redis and writes results to Postgres.

    ## Failure modes

    If Redis is unreachable, the gateway answers reads from its in-process
    cache for up to 60 seconds and then returns 503.

    Writes fail immediately with 503. There is no local queue, because a
    write the client believes landed and the cluster never saw is worse than
    a retry.
