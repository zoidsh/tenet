    # Configuration

    The daemon reads `/etc/app/config.toml` at startup and re-reads it on
    SIGHUP. An unknown key may, in some cases, potentially result in what
    could be considered a load error, depending on the circumstances.

    Keys are case-sensitive, and an environment variable of the same name
    uppercased and prefixed `APP_` wins over the file.

    ## Secrets

    A value beginning with `file:` is read from the path that follows, once
    at startup and never again.
