  code: |
    ## Migrating from 0.9

    `app config migrate` rewrites the two keys that moved in 3.0 and refuses
    to touch a file it cannot parse.

    A config written by hand against 0.9 should migrate unchanged; the
    rewrite has only been exercised against files `init` wrote, so run
    `app config check` afterwards and read what it prints.

    ## Removed

    `--lenient` is gone. An unknown key has been an error since 2.4 and the
    flag did nothing after that.
