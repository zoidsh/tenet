    ## Pinning the action

    The action is published by digest as well as by tag. A tag is moved on
    every patch release; a digest never moves.

    CI reads the digest from `.github/workflows/ci.yml` and fails the run if
    the file names a tag instead.

    It could be argued that it would likely be better for most projects to
    probably pin by digest wherever that is possible.
