    ## `app status`

    The command should usually complete more or less instantly, although it
    might occasionally take somewhat longer than that in a few cases.

    It reads the stage table and the lease table and prints one row per
    stage, with the worker id and the lease expiry.

    ## Exit codes

    0 when every stage is running, 1 when any stage is stalled, 2 when the
    database could not be reached.
