  code: |
    ## Cold caches

    A run against a cold module cache may take twice as long as a warm one.
    The figure depends on the runner's network, and the cache mount keyed on
    `go.sum` is what removes the variance.

    ## Measuring

    `make bench-ci` prints the time each stage took, read from the runner's
    own step timings rather than from the wall clock.

    A stage that gets slower by more than 10% against the stored baseline
    fails the run.
- label: ok
  lang: markdown
  code: |
    ## Watching files

    On Windows the watcher can miss a rename, because the platform API
    reports one as a delete and a create with no ordering between them.

    `--poll` falls back to a two-second stat loop, which costs more and
    misses nothing.

    ## Ignored paths

    Anything matched by `.gitignore` is ignored, and `--watch-all` turns that
    off for the run.
