  code: |
    ## Leases

    A worker leases a job for 30 seconds and extends the lease every 10 while
    it runs.

    If the process is paused for longer than the lease, this may possibly
    cause the worker to perhaps drop the job without noticing.

    ## Recovery

    The job is handed to another worker, which starts it from the beginning.
    A job that runs twice must leave the same rows behind.
