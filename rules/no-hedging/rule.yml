id: no-hedging
tenet: "Excessive hedging. 'could potentially possibly be argued that it might' becomes 'may'."
criteria:
  true: "One claim carries more than one marker of uncertainty, so several words do the work of one: a modal verb with an adverb of possibility, an impersonal frame that holds the claim at arm's length wrapped around a modal, a qualifier of scope on top of either, or a softener attached to a quantity that is already vague. The surplus is visible in the rewrite, where deleting every hedge but one leaves the meaning untouched. A single hedge on something the document elsewhere states as fact counts too: the software's own behaviour, which the writer knows, offered as something that may in some cases happen."
  false: "Exactly one hedge, marking a limit the writer genuinely cannot see past: the behaviour of a dependency or a platform, a figure that moves with the workload, a case the implementation has not settled. A modal that grants permission or states an option the reader has is not a hedge at all, and a possibility stated with the condition that brings it about is a fact however it is worded."
source: cursor/plugins pstack/skills/unslop/SKILL.md #24
