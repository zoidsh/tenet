id: no-hedging
tenet: "Excessive hedging. 'could potentially possibly be argued that it might' becomes 'may'."
criteria:
  true: "One claim carries more than one marker of uncertainty, so several words do the work of one: modals, adverbs of possibility, impersonal frames holding the claim at arm's length, and qualifiers of scope, stacked in any combination. The surplus shows in the rewrite, where striking every hedge but one leaves the meaning where it was."
  false: "A single hedge, and it marks something the writer genuinely cannot know: how a platform or a dependency will behave, or a figure that moves with the workload. A modal that grants the reader permission or offers them an option is not a hedge at all, and a possibility stated together with the condition that brings it about is a fact however it is worded."
source: cursor/plugins pstack/skills/unslop/SKILL.md #24
