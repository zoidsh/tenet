id: body-names-blast-radius
tenet: "The blast radius is the potential impact or scope of the changes introduced by this PR. Consider all possibilities."
criteria:
  true: "Nothing in the description tells the reader what would go wrong, and for whom, if the change is wrong. It can be complete about the problem, the mechanism and the reason and still never reach past the change to what depends on it. Where a blast radius is offered it fails in one of these ways, each of which leaves the harm unnamed. A bare grading of the risk with nothing named after it, whether the grade is a size or a denial that there is any reach at all. The territory the diff already covers handed back as its reach: the package, module, screen or flow the work happened in, or the layers and files touched, which says where the change is rather than what else depends on it. An assurance drawn from the change's own tests or review, which is about the change and not about its consumers; a sentence about how easily the change could be undone, or about nothing having been deleted, is the same kind of comfort, answering how far it can be walked back rather than what it reaches while it stands. The good the change does, set down where the harm it could do belongs. Or somebody outside the change named only as the one it helps or the reason it is being made, and never as something it could break. Removing or renaming a field, key or endpoint in the mechanism does not name a blast radius either, however plainly a reader could work out for themselves who was reading it; the description has to say who, or it has left that to the reviewer. A reach worth the name reaches somewhere the title has not already been: when everything it lists is the thing being changed, it has drawn a circle around the diff."
  false: "Somebody or something outside the change is named together with what would go wrong for it: a caller or consumer of an interface whose shape moves, including a client still on an older version, a screen or layout that would shift or a viewport it would break at, a job, report, dashboard or alert reading what the change writes, a team whose work sits downstream, a flow whose timing changes. Naming the reach and finding it small is stating it, so a bounded claim counts when the bound rests on something a reader can check, such as a package being internal with its callers named, or rows the change leaves untouched. What the bound may not rest on is the change having been tested."
source: mattpocock/skills pr SKILL.md line 159
