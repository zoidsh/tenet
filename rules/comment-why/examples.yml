    export function applyPatch(state: State, patch: Patch): State {
      if (patch.baseVersion !== state.version) {
        throw new ConflictError(patch.baseVersion, state.version);
      }
      const next = structuredClone(state);
      for (const op of patch.ops) {
        applyOp(next, op);
      }
      // Bump last; applyOp above reads next.version to stamp op provenance.
      next.version = patch.baseVersion + 1;
      return next;
    }
