    export class Uploader {
      private parts: Part[] = [];

      add(part: Part): void {
        this.parts.push(part);
      }

      // Callers must not add parts after finish; the ETag list is frozen here.
      async finish(): Promise<string> {
        const etags = this.parts.map((p) => p.etag);
        const res = await this.client.completeMultipart(this.uploadId, etags);
        this.parts.length = 0;
        return res.location;
      }
    }
