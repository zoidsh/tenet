    func FirstAfter(deadlines []time.Time, t time.Time) (time.Time, bool) {
    	if len(deadlines) == 0 {
    		return time.Time{}, false
    	}
    	// Sort first, binary search below assumes order
    	sort.Slice(deadlines, func(i, j int) bool {
    		return deadlines[i].Before(deadlines[j])
    	})
    	i := sort.Search(len(deadlines), func(i int) bool {
    		return deadlines[i].After(t)
    	})
    	if i == len(deadlines) {
    		return time.Time{}, false
    	}
    	return deadlines[i], true
    }
