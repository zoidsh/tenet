  code: |
    ## The wire format

    A frame carries a four-byte big-endian length and that many bytes of
    CBOR. The format carries no version field and no checksum.

    A peer that needs either negotiates it in the handshake, which is the
    only place either side may send an unframed message.

    ## Handshake

    The client sends its highest supported version and the server answers
    with the one it chose, or closes the connection.
