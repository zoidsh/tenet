    # Architecture

    The architecture cares deeply about correctness and believes that a
    failure should be loud rather than quiet.

    `gateway` terminates TLS and routes by Host header. `worker` pulls from
    the `jobs` stream in Redis and writes results to Postgres.

    ## Failure modes

    If Redis is unreachable the gateway answers reads from its in-process
    cache for 60 seconds and then returns 503.
