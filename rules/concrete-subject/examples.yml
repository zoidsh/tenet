  code: |
    ## Scaling

    Latency rises with the number of workers, because every worker polls the
    same table and the poll takes a shared lock.

    The cost grows linearly in the number of examples, since each one is a
    single call, and `--runs 3` triples it.

    ## Limits

    A queue holds at most 100000 pending jobs. Enqueueing past that returns
    `ErrQueueFull` rather than blocking the caller.
