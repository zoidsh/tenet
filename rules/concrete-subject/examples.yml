    Innovation in this space demands an approach that is willing to
    question what everybody else has settled on.

    The tool runs the whole batch inside one transaction, so a failure
    leaves the schema where it started.

    ## Ordering

    The numeric prefix is the whole of the order. Two files that share a
    prefix are an error at load time.
