id: concrete-subject
tenet: "Every sentence needs a human subject doing something."
criteria:
  true: "The finding is one sentence, the one in which an abstraction has been made to act, and it is reported on the line that sentence starts on. That sentence's subject is an abstraction — a quality, an ideal, a trend, a nominalised process — and its verb is one only an agent can perform: it wants, believes, cares, decides, aims, strives, understands, embraces, demands, refuses to compromise. Nobody in the sentence is doing anything, and a reader cannot tell who would have to act for the claim to hold. The same fault wears a possessive, where a team's philosophy or an architecture's opinion does the acting in place of the people who hold it. The violation is that sentence and no other: the surrounding prose about what a command reads or what a queue holds is not part of it, however few human subjects it contains."
  false: "The subject really performs the verb. A person or a role, the reader addressed in an imperative, or a named program, command, file, service or process doing what such a thing does: reading, writing, refusing, returning, retrying, exiting. An abstraction as subject is fine when the verb is not an agent's — a figure rises, a cost grows, a limit applies, a format carries a field — because nothing is being attributed to it that it cannot do. A sentence whose subject is a job, a queue, a frame, a file, a flag or a command is the ordinary voice of reference documentation: it satisfies the rule, and it is never the sentence to point at."
source: hardikpandya/stop-slop SKILL.md
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs, standalone]
