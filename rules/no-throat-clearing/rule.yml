id: no-throat-clearing
tenet: "Do not open responses or sections with fluff."
criteria:
  true: "A paragraph sits where information belongs and a reader could delete it without losing a fact. At the head of a document or a section: an announcement that an explanation is coming, a tautology that unpacks the heading's own noun phrase with the same words it is made of, an assertion that the subject is important, difficult or widely misunderstood, an instruction to understand or bear the subject in mind before reading on, or the acknowledgement and reassurance a chatbot offers before it answers. At the foot, the same fault wearing a heading: a final section, whatever it is called, that opens on a marker of recapitulation or a thanks-for-reading and whose sentences either name something a section above already said or merely assert that the material has now been covered. One such paragraph is a violation on its own, wherever in the document it sits, and a closing that only restates is one however plainly it is written."
  false: "The first sentence is already the section's first fact, or it states the scope of the page, what it does not cover, or where the rest lives, which a reader could act on. A closing section earns its place when it says something the body did not: a caveat, an interaction between the parts above, a decision the reader must make, a next command to run, or where to go next."
source: maxgoff/unslop SKILL.md, with cursor/plugins pstack/skills/unslop/SKILL.md #20
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs]
