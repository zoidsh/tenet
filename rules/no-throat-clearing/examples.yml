  lang: markdown
  code: |
    ## Backups

    `app backup` writes a single tar to the path you name and exits non-zero
    if the database is mid-migration.

    ## Restores

    `app restore` refuses to run against a data directory that is not empty,
    so a restore over a live installation is two commands, not one.

    ## Summary

    Neither command takes a lock, so a backup taken during a restore is not
    consistent. Run both from one cron entry, and keep `app backup --verify`
    in the same entry to check the tar before it is shipped anywhere.
