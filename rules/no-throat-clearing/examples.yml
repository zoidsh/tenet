    ## 3.0.0 - 2026-02-11

    ### Breaking

    - `Client.New` takes a `context.Context` as its first argument.
    - `Client.Close` returns an error rather than panicking on a double close.

    ### Added

    - `WithTimeout` replaces `SetTimeout`.

    ## Upgrade notes

    Run `go fix ./...` with the bundled rewrite rule. It handles the `New`
    signature but not the `Close` return, which the compiler will find for you.
