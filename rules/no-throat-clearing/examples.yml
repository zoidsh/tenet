  note: "A Conclusion heading over a paragraph that names the two limits the body left out. The tenet is about a closing that restates, not about the word Conclusion."
  lang: markdown
  code: |
    # Caching

    The cache keys on the SHA-256 of the request body and the model name. An
    entry expires 30 days after it was written, which `--cache-ttl` overrides.

    `--no-cache` skips the read and still writes the result, so a run with it
    leaves the cache warmer than it found it.

    ## Conclusion

    The cache is not shared between machines, and two processes writing one
    directory will corrupt it. If you need either, give each process its own
    `--cache-dir` and reconcile them outside the tool.
