    ## Rate limits

    Rate limits are limits on the rate at which you may call the API. It is
    worth understanding how they work before you build against it.

    Each token gets 600 requests a minute, counted in one-second buckets.
    Going over returns 429 with a `Retry-After` header in whole seconds.

    ## Quotas

    A quota is monthly and is not refilled by a failed request; a 429 does not
    count against it, a 500 does.
