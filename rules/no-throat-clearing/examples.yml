  lang: markdown
  code: |
    # Permissions

    A role is a named set of grants. A grant names a resource pattern and one
    of `read`, `write` or `admin`.

    A user holds any number of roles; the effective grant is the union, so a
    deny cannot be expressed and a role can only add.

    ## Built-in roles

    `owner` grants `admin` on `*` and `viewer` grants `read` on `*`. Neither
    can be deleted, and `owner` cannot be taken from the last user holding it.
