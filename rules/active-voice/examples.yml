    ## Caching a step

    The digest of the declared reads is computed and is compared against the
    one stored from the last successful run. If they match, the step is
    skipped.

    The runner does all of this before the first step starts, so a pipeline
    of cached steps costs one pass over the declarations.

    ## Invalidating

    `--no-cache` skips the comparison and still writes the digests.
