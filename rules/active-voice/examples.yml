  code: |
    ## What happens to a failed job

    A failed job is retried three times, one second apart, then two, then
    four. After the third it is moved to the dead-letter queue with its last
    error stored beside it.

    A job in the dead-letter queue is never picked up again. It is
    re-enqueued by hand with `app requeue <id>`, which clears the error.

    ## Inspecting one

    `app job show <id>` prints the payload, the attempt count and the last
    error.
