  code: |
    ## Down migrations

    It was decided that down migrations would not be supported, and the
    alternative of a new forward migration was chosen instead.

    Rolling back means writing a new forward migration, which is the only
    thing that survives a partially applied batch.

    ## Ordering

    The numeric prefix is the whole of the order. Two files that share a
    prefix are an error at load time rather than a coin toss at run time.
- label: violation
  lang: markdown
  lines: [3, 4]
  code: |
    ## Before a migration

    A backup should be taken before the migration is run, and the output of
    `app backup --verify` should be read before the deploy is started.

    `app backup` writes a single tar to the path you name. `app migrate`
    runs the whole batch inside one transaction.

    ## During

    Writers carry on. A migration that adds a column takes no lock; one that
    rewrites a table takes the table lock for the length of the rewrite.
