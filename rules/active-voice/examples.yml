    ## Errors

    Errors are logged and the job is marked failed. After a third failure
    the job is moved to the dead-letter queue and the last error is stored
    beside it.

    The worker does all of this. Nothing else writes to the job table, and
    `app status` reads it without taking a lock.

    ## Retries

    A retry waits one second, then two, then four.
