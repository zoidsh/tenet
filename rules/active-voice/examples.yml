  code: |
    ## Recovering a segment

    A segment written during the maintenance window carries no worker id.
    It was written by whichever worker held the lease at the time, and the
    log does not record which.

    `app segment repair` rewrites the header from the surrounding segments
    and leaves the body alone.

    ## When it cannot

    A segment whose neighbours are both missing is moved to `lost/` and
    reported. Nothing tries to guess at its contents.
- label: ok
  lang: markdown
  code: |
    # Workers

    A worker leases a job for 30 seconds and extends the lease every 10
    while it runs. A lease that expires is handed to another worker, which
    starts the job from the beginning.

    A worker runs one job at a time. Run more processes to run more jobs;
    there is no pool inside one.

    ## Draining

    `SIGTERM` finishes the job in flight and exits. A second `SIGTERM`
    exits at once and the lease expires 30 seconds later.
