  code: |
    # The daemon

    Configuration is read at startup and the listening port is set from it.
    The file is re-read whenever SIGHUP is received.

    `appd` is the process that does all of this. `appctl` talks to it over
    the unix socket at `/run/app.sock`.

    ## Keys

    Keys are case-sensitive, and an environment variable of the same name
    uppercased and prefixed `APP_` wins over the file.
