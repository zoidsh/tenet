id: active-voice
tenet: 'Active voice. Prefer it. Catch "is/are/was/were + past participle" and name the actor. Passive is fine only when the actor is unknown or genuinely doesn''t matter.'
criteria:
  true: "A passive construction leaves out an actor the passage has already put within reach, in a heading or a neighbouring sentence, or that is the reader being instructed. The reader can supply the actor and the sentence still declines to, so it is neither unknown nor beside the point and the tenet's exception does not reach it. An impersonal frame that reports a choice, a decision or an expectation with nobody behind it is the same fault. Turning either round needs no information the passage does not already hold."
  false: "The passive is the right construction. Nothing on the page records who or what acted; or the doer is the single mechanism the section is about, so naming it in each sentence would add nothing; or the affected thing is the paragraph's topic and promoting the actor would move the paragraph off it. Imperatives addressed to the reader, and ordinary active sentences, are outside this rule."
source: cursor/plugins pstack/skills/unslop/SKILL.md #29
