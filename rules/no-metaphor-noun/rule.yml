id: no-metaphor-noun
tenet: 'Abstract metaphor nouns. Substrate, wedge, vector, locus, vantage, nexus, primitive (as noun), harness (as metaphor), surface (as in "API surface"), bedrock, scaffolding (as metaphor), modality, paradigm, gold-plating, ratchet (as metaphor), evacuate (for moving code), endgame, north star, flywheel.'
criteria:
  true: "One of these nouns is doing figurative work. It stands in for a part, a goal, a foundation, an extent or an effect that the page could have named with the plain word for the thing itself, and it brings none of the properties of what it literally denotes. Swapping the plain word in costs the sentence nothing."
  false: "The noun is the ordinary term of the domain the page is about, meaning to a reader of that domain exactly what it says, including where the project or its neighbours have taken it as the name of a component, a field or a product."
source: cursor/plugins pstack/skills/unslop/SKILL.md #26
