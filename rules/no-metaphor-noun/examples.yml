  code: |
    # Configuration

    `config.toml` is the substrate on which every other tool in the
    repository builds.

    The daemon reads it at startup and re-reads it on SIGHUP. Keys are
    case-sensitive and an unknown key is an error at load time.

    ## Overrides

    An environment variable of the same name uppercased and prefixed `APP_`
    wins over the file, and a flag wins over both.
