  code: |
    ## The wire format

    A frame is a four-byte big-endian length followed by that many bytes of
    CBOR. Lengths above 16 MiB are rejected before the body is read.

    The client sends its highest supported version and the server answers
    with the one it chose, or closes the connection.

    This handshake is the bedrock of everything above it, and widening its
    surface area is the decision the 3.0 line exists to avoid.
