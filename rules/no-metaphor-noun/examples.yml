  code: |
    # Advisory 2026-03: symlink in the output directory

    The attack vector is a symlink planted in the output directory before a
    build runs. `build --clean` followed the link and deleted the target.

    ## Affected versions

    2.0 through 2.3. Fixed in 2.4, which refuses to delete anything outside
    the directory it is cleaning.

    ## Workaround

    Run the build with the output directory on a filesystem the build user
    alone can write.
- label: ok
  lang: markdown
  code: |
    # Reading the sensor

    The board reports substrate temperature on register 0x2A as a signed
    12-bit value in quarter-degrees.

    A read while the converter is busy returns the previous sample rather
    than blocking, so poll no faster than the 50ms conversion time.

    ## Calibration

    The offset is stored in the top nibble of 0x2B and is applied by the
    driver, not by the board.
- label: ok
  lang: markdown
  code: |
    # Variant records

    A record names a locus by chromosome and one-based position, and carries
    the reference and alternate alleles at that locus.

    Two records at the same locus are merged only when their reference
    alleles agree; otherwise both are kept and the conflict is reported.

    ## Sorting

    Records sort by chromosome in the order the header declares, then by
    position. A record on an undeclared chromosome is an error.
- label: ok
  note: "North Star is the name of a product the exporter writes to, not a description of a goal."
  lang: markdown
  code: |
    ## Exporters

    - **North Star.** One event per finished job, posted to the collector
      named in `exporters.northstar.url`.
    - **Statsd.** One counter per job outcome and one timer per job, sent
      over UDP to `exporters.statsd.addr`.

    An exporter that fails is retried for an hour and then disabled, with
    the failure written to the audit log.

    ## Adding one

    An exporter is a plugin. `docs/plugins.md` has the request shape.
- label: ok
  lang: markdown
  code: |
    # Rendering

    Each layer is drawn to its own surface and the surfaces are composited
    in declaration order.

    A surface is allocated at the layer's own resolution, so a layer scaled
    down costs less memory than the canvas it lands on.

    ## Invalidation

    A layer that has not changed keeps its surface between frames. Resizing
    the window drops every surface.
