  code: |
    ## Watch mode

    `--watch` is the thin end of the wedge for the daemon mode the project
    has wanted for two releases.

    It re-runs the build when a tracked file changes, debounced by 200ms,
    and exits on the first build that fails.

    ## What it watches

    Everything the last build read, which is what `build.lock` records. A
    new import is picked up on the next successful build, not before.
