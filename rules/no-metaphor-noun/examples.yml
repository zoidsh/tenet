  note: "A vector as an ordered tuple of numbers, which is what the word means in this domain."
  lang: markdown
  code: |
    # Embeddings

    Each document is stored as a 768-dimensional vector of float32, keyed by
    the document id.

    Similarity is cosine, computed over the normalised vectors, so the dot
    product is enough and no division happens at query time.

    ## Storage

    Vectors are held in one memory-mapped file. An index over more than
    about two million documents will not fit on a 16 GB machine.
