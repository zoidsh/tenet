    # Principles

    Correctness is the north star, and every trade-off in the scheduler is
    made against it.

    A job runs at least once. A job that runs twice must leave the same rows
    behind, because the runner promises nothing stronger.

    ## Ordering

    Jobs in one queue run in priority order, and ties go to whichever was
    enqueued first.
