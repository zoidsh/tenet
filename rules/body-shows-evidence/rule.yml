id: body-shows-evidence
tenet: "Concrete evidence that the change works. Show the exact steps taken and the outcomes observed."
criteria:
  true: "The description offers the reader nothing they could look at to see that the change works: it says what the change does and stops there, or what stands in for evidence is a claim that the checking happened, that somebody ran it, that it behaves as intended, that the suite or the pipeline came back green, with no result quoted from any of it. Naming which cases were covered is the same claim when no outcome comes with it, and so is a figure that measures the checking rather than the behaviour, a share of lines covered or a stretch of time the branch has been up: both add diligence and neither adds an outcome. Evidence from one side only fails for a different reason. A response quoted as it now comes back, or a captured screen of how it now looks, carries the form of execution evidence and is still a single state: with nothing of how things stood before, the reader is shown a state and not a change, and the same line or the same picture would be just as true of a tree where the work was never done. Two states are the evidence; one is a description of the new one."
  false: "The reader is given something particular enough to be wrong: two sides of a measurement or of a screen, a failure before and its absence after, the output of a command set against what the command used to answer, or the steps somebody took written out so that another person could take them and see the same thing. It counts whether it comes from a test run, a benchmark, a console or somebody working through the product by hand, and a single line carrying both sides of a number is enough."
source: mattpocock/skills pr SKILL.md lines 149 and 153
