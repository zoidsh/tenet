id: inline-header-detail
tenet: 'Inline-header lists. The tell is a bold label and colon that restates the line: "**Performance:** Performance improved...". A bold lead-in that ends in a period, names the item, and is followed by genuinely new detail is fine, not a tell.'
criteria:
  true: "A list of bold lead-ins where what follows the bold introduces no noun, number or verb the bold did not already supply. It reaches for the lead-in's own root word, turns its noun into a verb of the same stem or back again, offers a synonym, or asserts that the thing is good or easy. Spelling an identifier out in the English of its own name counts. The punctuation after the bold is not what decides it: a period restating the label is the fault the colon is named for, and the carve-out is earned by the new detail, not by the full stop."
  false: "What follows the bold lead-in carries something the lead-in could not: a default, a limit, a unit, a command, a file, a condition, a consequence, an exception, the mechanism behind a claim, or what happens when the thing is absent. The bold is then a label and the sentence is the content, which is the case the tenet calls fine. A list with no bold lead-ins, and bold used for emphasis inside a running sentence, are outside this rule."
source: cursor/plugins pstack/skills/unslop/SKILL.md #16
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs, standalone]
