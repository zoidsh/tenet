id: inline-header-detail
tenet: "Inline-header lists. A bold lead-in that ends in a period, names the item, and is followed by genuinely new detail is fine, not a tell."
criteria:
  true: "A list of bold lead-ins where the text after the bold introduces no noun, number or verb the bold did not already supply. It reaches for the lead-in's own root word, turns its noun into a verb of the same stem or its verb back into a noun, offers a synonym, or asserts that the thing is good, easy or dependable. Spelling an identifier out in the English of its own name counts: a flag named for an action, described as performing that action, or a term described as the thing it is called. The test is deletion: strike everything after the bold and the list still tells the reader exactly as much as it did. A run of such items is a single violation covering the run."
  false: "What follows the bold lead-in carries something the lead-in could not: a default, a limit, a unit, a command, a file, a condition, a consequence, an exception, the mechanism behind a claim, or what happens when the thing is absent. The bold is then a label and the sentence is the content, which is what the tenet says is fine. A list with no bold lead-ins, bold used for emphasis inside a running sentence, and a definition list whose terms are genuinely defined are all outside this rule."
source: cursor/plugins pstack/skills/unslop/SKILL.md #16
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs]
