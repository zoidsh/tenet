  code: |
    ## Features

    - **Fast.** The whole batch runs in one transaction, so a hundred
      migrations cost one round trip rather than a hundred.
    - **Reliable.** A batch that fails rolls back whole; there is no half
      state to unpick by hand afterwards.
    - **Simple.** There are no down migrations. Rolling back means writing
      a new forward migration.

    ## Requirements

    Go 1.22 or later, and a POSIX shell for the hooks.
- label: ok
  lang: markdown
  code: |
    ## Flags

    - **`--watch`.** Re-runs the build when a tracked file changes, debounced
      by 200ms.
    - **`--clean`.** Empties the output directory first, and refuses to run
      if it holds anything the build did not write.
    - **`--verbose`.** Prints one line per file to stderr; stdout is
      unchanged, so a pipe still works.
    - **`--quiet`.** Suppresses everything but the exit code.

    ## Exit codes

    0 on success, 1 on a failed build, 2 when the config could not be read.
- label: ok
  lang: markdown
  code: |
    ## Concepts

    - **Queue.** A name, a concurrency limit and a retry policy. At most
      100000 jobs may be pending in one.
    - **Worker.** One process running one job at a time. More workers means
      more processes; there is no pool inside one.
    - **Lease.** Thirty seconds of ownership, extended every ten. A lease
      that expires hands the job to another worker.

    ## Getting started

    Start a worker with `app worker --queue default`.
- label: ok
  lang: markdown
  code: |
    ## Storage backends

    Three backends ship with the binary.

    - **`sqlite`.** One file, one writer, nothing to install. The default.
    - **`postgres`.** Many writers, and it needs a server, a connection
      string and a migration run before first use.
    - **`memory`.** For tests. Everything is lost when the process exits.

    ## Choosing

    Pick `postgres` when more than one process writes and `sqlite` when one
    does. No configuration makes `sqlite` take two writers.
