  code: |
    ## Upgrading to 3.0

    Read this before you upgrade: `app config migrate` **rewrites the file in
    place**, and it keeps no backup.

    The two keys that moved are `cache.path`, now `cache.dir`, and
    `log.file`, now `log.path`. Everything else is carried over untouched.

    A file the migrator cannot parse is **left alone** and reported, so a
    hand-written config is never half-rewritten.
