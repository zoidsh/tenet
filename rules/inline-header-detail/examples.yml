  code: |
    ## Glossary

    - **Digest.** The SHA-256 of a step's declared reads. A step whose digest
      matches its last successful run is skipped.
    - **Dead letter.** The queue a job lands in after its third failure, with
      the last error stored beside it.
    - **Stall.** A writer blocked on disk or on the network. `app status`
      reports it and nothing else does.

    ## Reading further

    `docs/protocol.md` has the wire format.
