    ## What `make check` runs

    - the unit tests, with the race detector
    - `golangci-lint`, with the repository's own config
    - `gofmt -l` over the tree, which fails on any output

    CI runs the same target, so a green `make check` is a green CI.

    ## What it does not run

    The tests that call the real API. `make test-live` runs those, and they
    need a key in the environment and cost money.
