    import { createServer, type Server } from "node:http";
    import { fetchJson } from "./fetch-json";

    let server: Server;
    let baseUrl: string;

    beforeAll(async () => {
      server = createServer((req, res) => {
        res.setHeader("content-type", "application/json");
        res.end(JSON.stringify({ path: req.url, ok: true }));
      });
      await new Promise<void>((resolve) => server.listen(0, resolve));
      const { port } = server.address() as { port: number };
      baseUrl = `http://127.0.0.1:${port}`;
    });

    afterAll(() => new Promise((resolve) => server.close(() => resolve(null))));

    it("returns the decoded body", async () => {
      const body = await fetchJson(`${baseUrl}/widgets`);
      expect(body).toEqual({ path: "/widgets", ok: true });
    });
