    func TestSessionExpiresAfterIdleWindow(t *testing.T) {
    	clock := clockwork.NewFakeClockAt(time.Date(2024, 3, 1, 9, 0, 0, 0, time.UTC))
    	// NewSessionStore takes a Clock in production too; main passes clockwork.NewRealClock().
    	store := NewSessionStore(WithClock(clock), WithIdleTimeout(15*time.Minute))

    	token, err := store.Create("u-1")
    	if err != nil {
    		t.Fatalf("Create: %v", err)
    	}

    	clock.Advance(14 * time.Minute)
    	if _, err := store.Resolve(token); err != nil {
    		t.Fatalf("Resolve before the window closes: %v", err)
    	}

    	clock.Advance(2 * time.Minute)
    	if _, err := store.Resolve(token); !errors.Is(err, ErrSessionExpired) {
    		t.Errorf("Resolve after the window = %v, want ErrSessionExpired", err)
    	}
    }
