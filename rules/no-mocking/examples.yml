    import json

    from importer import import_orders


    def test_import_orders_reads_a_jsonl_file(tmp_path):
        source = tmp_path / "orders.jsonl"
        rows = [
            {"id": "o-1", "total": 1200, "status": "paid"},
            {"id": "o-2", "total": 900, "status": "refunded"},
            {"id": "o-3", "total": 4500, "status": "paid"},
        ]
        source.write_text("\n".join(json.dumps(row) for row in rows), encoding="utf-8")

        report = import_orders(source, out_dir=tmp_path / "out")

        assert report.imported == 2
        assert report.skipped == 1
        written = (tmp_path / "out" / "paid.csv").read_text(encoding="utf-8")
        assert written.splitlines()[0] == "id,total"
