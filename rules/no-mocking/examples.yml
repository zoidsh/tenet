        monkeypatch.setattr(feedreader, "fetch_feed", lambda url: SAMPLE_FEED)

        reader = feedreader.Reader(cursor="2024-04-01T00:00:00Z")
        entries = reader.refresh("https://example.com/feed.xml")

        assert [entry["id"] for entry in entries] == ["e-3", "e-4"]
        assert reader.cursor == "2024-04-12T08:30:00Z"
