# Labelled cases for the body-few-visuals tenet, measured by `tenet check`.
# Each example is a pull request text: the title on the first line, a blank
# line, then the description.
- label: violation
  lines: [7, 10]
  lang: text
  code: |
    Redesign the billing settings page

    The page had grown to four cards with no order to them, and the
    plan card, which is the one people come for, was the third one
    down.

    ![the plan card](docs/img/billing-plan.png)
    ![the payment method card](docs/img/billing-payment.png)
    ![the invoice history card](docs/img/billing-invoices.png)
    ![the tax details card](docs/img/billing-tax.png)
- label: violation
  lines: [11, 16]
  lang: text
  code: |
    Split the notification service out of the monolith

    Notifications were the noisiest neighbour in the monolith: a slow
    SMS provider took request threads with it, and the on-call could
    not restart notifications without restarting checkout.

    The service is its own deployment behind a queue.

    ## Diagrams

    ![the monolith today](docs/img/notif-before.png)
    ![the service and its queue](docs/img/notif-after.png)
    ![the deployment topology](docs/img/notif-deploy.png)
    ![the retry state machine](docs/img/notif-retry.png)
    ![the database split](docs/img/notif-db.png)
    ![the rollout sequence](docs/img/notif-rollout.png)
- label: violation
  lines: [3, 5]
  lang: text
  code: |
    Add a keyboard shortcut palette

    ![the palette open](docs/img/palette-open.png)
    ![the palette filtered](docs/img/palette-filter.png)
    ![the palette empty state](docs/img/palette-empty.png)

    Power users have been asking for a way to reach the actions
    without the mouse, and the three we hear about most are buried two
    menus deep.

    The palette opens on Cmd-K and searches the action registry.
- label: violation
  lines: [10, 13]
  lang: text
  code: |
    Rework the onboarding checklist

    People were finishing the first two steps and never coming back,
    and we could not tell from the funnel whether they were stuck or
    done.

    Each step now reports its own completion and the list shows
    progress.

    ![step one](docs/img/onboard-1.png)
    ![step two](docs/img/onboard-2.png)
    ![step three](docs/img/onboard-3.png)
    ![the finished list](docs/img/onboard-done.png)
- label: violation
  lines: [10, 20]
  lang: text
  code: |
    Introduce a read replica for the reporting queries

    Reporting queries were running against the primary and their locks
    showed up as write latency on the checkout path twice last month.

    Reports now go to a replica through a separate connection pool.

    ## Architecture

    ![the pools before](docs/img/replica-before.png)

    ```mermaid
    graph LR
      app --> primary
      app --> replica
    ```

    | query        | primary | replica |
    | ------------ | ------- | ------- |
    | daily report | 1200ms  | 1180ms  |
- label: violation
  lines: [12, 16]
  lang: text
  code: |
    Give the mobile nav a bottom bar

    The hamburger menu put every destination two taps away, and the
    two people use most, search and inbox, were the two furthest down
