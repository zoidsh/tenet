- label: violation
  lines: [11, 12]
  lang: text
  code: |
    Show a diff view on the document history page

    Readers could open an old revision but not see what had changed
    between two of them, so they were opening both in tabs and reading
    across.

    The history page gains a two-up diff.

    ## Screenshots

    ![the history list](docs/img/history-list.png)
    ![the diff view](docs/img/history-diff.png)
  note: >-
    Only two, and the count is within the cap. They are still parked in a
