id: no-connector-colon
tenet: "Colon overuse. Not as mid-sentence connectors."
criteria:
  true: "A colon stands in for a word. Either the half before it is a noun phrase or a bare announcement and the half after it is the point, so the sentence reads as a set-up and a punchline; or both halves are whole clauses that a conjunction would have joined, and the colon is carrying the because, the so or the and. A single word or short phrase delivered after an announcement is a punchline however much it resembles a list of one. One colon used any of these ways is already the violation; overuse is the name of the habit, not a threshold, so the passage needs no second colon for the first to count, and several within a few lines are the same fault repeated. Writing the missing word in, or breaking the sentence at a full stop, would lose nothing."
  false: "The colon introduces what a colon is for: a bulleted block, or an inline list of two or more items, a block of code or sample output, the definition of a term the line has just named, or the value of a key in front matter, a table row or a labelled line. A colon inside a token — a time of day, a ratio, a namespaced permission or identifier, an HTTP header name, a URL scheme — is part of the token and not punctuation at all."
source: cursor/plugins pstack/skills/unslop/SKILL.md #14
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs, standalone]
