id: no-connector-colon
tenet: "Colon overuse. Colons are fine before a list or example. Not as mid-sentence connectors."
criteria:
  true: "A colon stands in for a word. Either the half before it is a noun phrase or a bare announcement and the half after it is the point, so the sentence reads as a set-up and a punchline; or both halves are whole clauses that a conjunction would have joined, and the colon is carrying the because, the so or the and. A single word or short phrase delivered after an announcement is a punchline however much it resembles a list of one. One colon used either way is already the violation, because overuse names the habit rather than a threshold."
  false: "The colon introduces what the tenet says a colon is for, a list or an example: a bulleted block, an inline list of more than one item, a block of code or sample output, or the definition of the term the line has just named. A colon that is part of a token rather than punctuation, as in a time, an identifier, a header name, or a key and its value, is not this rule's business at all."
source: cursor/plugins pstack/skills/unslop/SKILL.md #14
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs, standalone]
