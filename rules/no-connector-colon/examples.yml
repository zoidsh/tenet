    # Schedules

    `cron` enqueues the reconciliation at 02:00 UTC and the digest at 06:30.

    A job needs `write:jobs` to enqueue and `read:jobs` to list. The `owner`
    role holds both and `viewer` holds neither.

    ## Time zone

    Times are UTC. There is no per-tenant time zone, and a tenant that wants
    one schedules its own job against its own clock.
