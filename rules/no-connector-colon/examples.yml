    # Configuration

    Set the port in one place only: two sources that disagree are resolved
    without a word and the file is not the one that wins.

    `APP_PORT` overrides `port` in the file, and a flag overrides both. An
    unknown key is an error at load time.

    ## Secrets

    A value beginning with `file:` is read from the path that follows. The
    file is read once at startup and is never watched for changes.
