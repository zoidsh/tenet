    ## The three failure modes

    Disk full: the writer blocks. Network partition: the writer blocks. Clock
    skew: the writer does not block, and that is the one that will cost you a
    weekend.

    A blocked writer shows up in `app status` as a `stalled` stage. A writer
    that accepted a skewed timestamp shows up nowhere until the compaction
    rejects the segment.

    ## What to do

    Run `app status` before the compaction window rather than after it.
