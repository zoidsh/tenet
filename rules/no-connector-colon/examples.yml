    # Why the build is slow

    The cause: a cold module cache on every runner. The fix: a cache mount
    keyed on the hash of `go.sum`.

    Each job starts from the base image and downloads 400 MB of modules
    before it compiles anything at all.

    ## Measuring

    `make bench-ci` prints the time each stage took, read from the runner's
    own step timings rather than from the wall clock.
