  code: |
    ## Leases

    There is one thing to remember about leases: they expire while your job
    is still running.

    A worker extends its lease every 10 seconds. A worker that pauses for
    longer than 30 loses the job to another worker, which starts it again
    from the beginning.

    ## Idempotency

    A job that runs twice must leave the same rows behind, because the runner
    promises only that it runs at least once.
