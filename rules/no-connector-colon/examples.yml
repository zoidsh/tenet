    # Authentication

    Rotate early: a token that expires mid-run takes the whole run with it.

    An expired token returns 401 with `WWW-Authenticate: Bearer
    error="expired"`. A token whose `nbf` is in the future returns the same
    401, which is why a machine with a skewed clock looks like a machine with
    a bad token.

    ## Rotating

    `app token rotate` issues a new token and keeps the old one valid for an
    hour.
