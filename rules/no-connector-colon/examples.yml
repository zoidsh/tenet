    ## Performance

    One number matters here: p99.

    The scheduler is tuned for the tail, so a change that halves the mean and
    doubles the p99 counts as a regression by this project's measure.

    ## Benchmarks

    `make bench` runs the suite five times and prints the median of the p99s,
    which is what CI compares against the stored baseline.
