    # Deployment

    Deploys are gated on one thing: tests.

    `deploy` refuses to run while the branch's latest CI run is red or
    missing. It reads the run from the API rather than from a status badge,
    so a cached badge cannot let a bad build through.

    ## Rolling back

    `deploy --to <sha>` redeploys an earlier image. It does not revert the
    database, which is a separate migration.
