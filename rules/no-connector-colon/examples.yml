  code: |
    ## Glossary

    Lease: the window in which one worker owns a job.

    Dead letter: the queue a job lands in after its last retry.

    Digest: the SHA-256 of a step's declared reads, which decides whether the
    step is skipped on the next run.

    Stall: a writer blocked on disk or on the network, reported by
    `app status` and by nothing else.
- label: ok
  lang: markdown
  code: |
    # Workers

    A worker leases a job for 30 seconds and extends the lease every 10 while
    it runs. A lease that expires is handed to another worker.

    A job that fails is retried three times and then moved to the dead-letter
    queue with its last error stored beside it.

    ## Concurrency

    One worker runs one job at a time. Run more processes to run more jobs;
    there is no thread pool inside a worker.
