  code: |
    ## Backends

    Three backends ship: `sqlite`, `postgres` and `memory`.

    `sqlite` keeps everything in one file and takes a single writer.
    `postgres` takes many writers and needs a server, a connection string and
    a migration run before first use. `memory` is for tests and loses
    everything when the process exits.

    ## Choosing

    Pick `postgres` when more than one process writes and `sqlite` when one
    does. No configuration makes `sqlite` take two writers.
