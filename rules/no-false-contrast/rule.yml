id: no-false-contrast
tenet: "'Not just X, but Y.' State the point directly instead."
criteria:
  true: "A passage is built as a denial and its correction, and the correction is a grander or more abstract characterisation of the very thing the denial named. The construction counts in every dress it wears: softened by just, merely, simply or only, or a flat negative with no softener; joined by a comma, a semicolon or but; and split into two consecutive short sentences as readily as held in one. Both halves describe the same subject, so the sentence adds no behaviour a reader could act on; its work is emphasis, and the affirmative half standing alone would say everything the whole sentence says. It is a violation even when the denied half happens to be true, because nobody was disputing it."
  false: "The two halves are about different things and the denial informs. It names a behaviour the subject does not have, a limit it does not lift, a guarantee it does not make, a named alternative the page is weighing it against, or a behaviour an earlier version had and this one does not; and what follows is a consequence, a command, a flag or a condition rather than a bigger word for the same idea. A passage with no denial-and-correction sentence in it is not this rule's business."
source: cursor/plugins pstack/skills/unslop/SKILL.md #9
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
