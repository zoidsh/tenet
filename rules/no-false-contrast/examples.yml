  code: |
    ## The index

    Rebuilding is not merely a performance optimisation, it is a correctness
    requirement.

    The index stores the document id and a byte offset. A document rewritten
    in place keeps its id, so a stale offset points into the middle of another
    record and the reader hands back a truncated document.

    Run `idx rebuild` after any in-place rewrite, or pass `--rewrite-safe` to
    the writer, which appends instead of overwriting.
