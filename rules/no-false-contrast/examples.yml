  code: |
    # Choosing a storage backend

    `sqlite` keeps everything in one file and takes a single writer. It is the
    default because it needs nothing installed.

    `postgres` takes many writers and needs a server, a connection string and
    a migration run before first use.

    Pick `postgres` when more than one process writes, and `sqlite` when one
    does. There is no configuration that makes `sqlite` take two writers.
