# Labelled cases for the no-false-contrast tenet, measured by `tenet check`.
- label: violation
  lang: markdown
  lines: 3
  code: |
    # Pipelines

    A pipeline is not just a list of steps, it is a contract between them.

    Each step declares the artifacts it reads and the ones it writes. The
    runner refuses to start a pipeline whose declared reads no earlier step
    produces.

    ## Caching

    A step is skipped when the digest of its declared reads matches the one
    recorded on its last successful run.

    ## Failure

    A failed step stops the pipeline; the steps after it are never started.
- label: violation
  lang: markdown
