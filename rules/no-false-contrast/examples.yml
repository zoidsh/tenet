    ## 3.0.0 - 2026-02-11

    ### Changed

    - `Close` no longer panics on a second call; it returns `ErrClosed`.
    - The cache directory is no longer `./.cache`. It is the platform cache
      directory, `~/.cache/app` on Linux, and `--cache-dir` overrides it.

    ### Removed

    - `--lenient`, which accepted unknown config keys. An unknown key has been
      an error since 2.4 and the flag has done nothing since.
