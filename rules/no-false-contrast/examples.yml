    ## Why YAML

    The config format is not just a serialisation choice, it is an interface.

    Anything the file accepts today has to keep being accepted tomorrow.
    `app config migrate` rewrites the two keys that moved in 3.0 and refuses
    to touch a file it cannot parse.

    ## Unknown keys

    An unknown key is an error at load time. There is no lenient mode and no
    flag that turns one on.
