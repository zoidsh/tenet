    # Release process

    Tagging is not only about marking a commit, but about telling the build
    system which artefacts to keep.

    `make release` reads the tag, writes it into `version.go` and uploads the
    binaries under a prefix of the same name.

    ## Untagged builds

    An untagged build lands under `dev/` and is deleted 14 days after it was
    uploaded, whether or not anything downloaded it.
