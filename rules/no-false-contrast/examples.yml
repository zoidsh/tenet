    # Reviews

    ## What a review is for

    A review isn't a gate. It's a conversation.

    A reviewer leaves comments on the diff and either approves it or requests
    changes. One approval merges a patch.

    ## Blocking

    A request for changes blocks the merge until the reviewer resolves it, or
    until a maintainer dismisses it with a reason in the thread.
