    ## The HTTP API

    The API is not just a set of endpoints; it is the contract every client
    is written against.

    Every response carries a `schema` header naming the version it was
    serialised under, and a client that sends an unknown version gets a 400.

    ## Deprecation

    An endpoint marked deprecated answers for two more minor releases and
    sets `Sunset` to the date it stops.
