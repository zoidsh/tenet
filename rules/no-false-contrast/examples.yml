    ## Backups

    `app backup` is not a snapshot: it copies rows while writers carry on, so
    a backup taken during a bulk import holds some of the imported rows and
    not others.

    Pass `--quiesce` to take the write lock first, which blocks writers for
    the length of the copy.

    ## Verifying

    `app backup --verify` reads the tar back and checks every row count
    against the table it came from.
- label: ok
  lang: markdown
  code: |
    ## Timeouts

    `--timeout` is not a deadline on the whole run; it bounds a single HTTP
    request. A run of 40 requests with `--timeout 5s` can take 200 seconds
    before it gives up.

    `--deadline` is the one that bounds the run, and a run that hits it exits
    3 with the partial results already written.

    ## Retries

    A timed-out request is retried twice with a one-second pause. A request
    that returns 4xx is not retried at all.
