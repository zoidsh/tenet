    ## The queue

    The queue is not a buffer; it is the system's memory of what it owes.

    A job stays on the queue until a worker acknowledges it, and an
    unacknowledged job is redelivered after the lease expires.

    ## Ordering

    Jobs are delivered in the order they were enqueued within one partition,
    and in no particular order across partitions.
