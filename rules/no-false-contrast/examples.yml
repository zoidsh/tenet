  code: |
    ## Troubleshooting

    ### The hook does not run

    Installing the package does not install the hook. `tool hook install`
    writes it, and it writes nothing if `.git/hooks/pre-commit` already
    exists.

    Move the file you have out of the way, run the install again, and paste
    the old contents back under the line the installer wrote.

    ### The hook runs twice

    Two installs in a worktree and its main checkout share `.git/hooks`. The
    second install is what you are seeing; remove one.
