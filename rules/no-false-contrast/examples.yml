  lang: markdown
  code: |
    ## The wire format

    A frame is a four-byte big-endian length followed by that many bytes of
    CBOR. Lengths above 16 MiB are rejected before the body is read.

    The format does not carry a version, a checksum or a compression flag.
    A peer that needs any of those negotiates them in the handshake, which is
    the only place where either side may send an unframed message.

    ## Handshake

    The client sends its highest supported version and the server answers with
    the version it chose, or closes the connection.
- label: ok
  lang: markdown
  code: |
    # Workers

    A worker leases a job for 30 seconds and extends the lease every 10 while
    it runs. A lease that expires is handed to another worker.

    A job that fails is retried three times, then moved to the dead-letter
    queue with the last error stored beside it.

    ## Concurrency

    One worker runs one job at a time. Run more processes to run more jobs;
    there is no thread pool inside a worker.
