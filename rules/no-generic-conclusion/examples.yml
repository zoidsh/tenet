  code: |
    ## Plugins

    A plugin is a directory with a `plugin.toml` and one executable.

    Plugins load in the order they appear in `plugins.toml`. Two plugins
    that register the same command are an error at load time.

    ## Writing one

    The executable reads a JSON request on stdin and writes a JSON response
    on stdout. `plugin.toml` names the commands it registers.

    The request shape is frozen for the 2.x line. A plugin that needs a
    field it does not carry should open an issue rather than parse stdin
    twice.
