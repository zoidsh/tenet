  note: "The closing is a limitation that will stand rather than a plan, which is a fact about the future and not a generic one."
  lang: markdown
  code: |
    ## Workers

    A worker leases a job for 30 seconds and extends the lease every 10
    while it runs. A lease that expires is handed to another worker.

    A job that fails is retried three times and then moved to the
    dead-letter queue with its last error stored beside it.

    ## Concurrency

    One worker runs one job at a time. Run more processes to run more jobs.

    There will be no thread pool inside a worker. A job holds a transaction
    open, and two of them in one process would share the connection.
