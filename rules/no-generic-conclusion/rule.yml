id: no-generic-conclusion
tenet: "Generic conclusions. 'The future looks bright.' State specific plans or facts."
criteria:
  true: "A passage ends on a claim about what is coming or about why the work matters, and nothing in it could turn out to be false. Its subject is the project's momentum, the field's direction, or the writer's feelings and continuing intentions, and its verbs are open-ended, so a year later the sentence would be neither kept nor broken. A section headed as a roadmap or a status that holds only such sentences is the same fault under a heading that promised otherwise."
  false: "The closing commits to something a reader could follow up or later find to have been wrong. It is pinned to a release, an issue, a decision or a named thing to run or read, so somebody could come back and hold the page to it. One such commitment is enough, and saying outright that nothing is planned is itself one."
source: cursor/plugins pstack/skills/unslop/SKILL.md #25
include: ["**/*.md", "**/*.mdx", "**/*.rst", "**/*.txt", "docs/**"]
kind: [prose]
tags: [prose, docs]
