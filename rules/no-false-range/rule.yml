id: no-false-range
tenet: "False ranges. 'from X to Y' where X and Y aren't on a meaningful scale."
criteria:
  true: "A from-X-to-Y or X-through-Y construction is used to suggest breadth rather than to bound anything. The two ends are members of an unordered set, picked because they sound far apart: two kinds of file, two tools, two product names, two places something can run, two fields of a record, two tasks a program performs. None of these is the extreme of any quantity, nothing lies between them to be included, and exchanging the ends leaves the sentence saying exactly what it said before, which is the test. The construction is standing in for such as or for and, and the word everything or anything often leans on it. Two tasks that happen to run one after the other are not a scale either, unless the sentence means every step that falls between them and the document has said what those steps are. What the sentence claims may be perfectly true and the rest of it perfectly concrete; the fault is the span, so a clause buried mid-sentence counts as readily as one that opens a page."
  false: "The ends bound a real span and the middle of that span exists: numbers, versions, sizes, counts, exit codes, dates, times, days of the week, or a rank the document itself has defined; or the sentence describes a literal movement or conversion from one named thing into another. A list of examples given as such as, including, or plain items joined by and is not a range at all and is not this rule's business."
source: cursor/plugins pstack/skills/unslop/SKILL.md #12
