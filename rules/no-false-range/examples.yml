  code: |
    # audit

    audit reads everything from your `Dockerfile` to your CI config and tells
    you which services drifted from the chart in the repository.

    ## Usage

        audit ./services --out report.json

    The report holds one object per service, with the image digest, the chart
    version and the last deploy time read from the cluster.

    ## Exit codes

    0 when nothing drifted, 1 when something did, 2 when the cluster could not
    be reached.
