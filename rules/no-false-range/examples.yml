  code: |
    # Compatibility

    The client speaks to servers from 1.2 through 1.9. A 1.1 server closes the
    connection during the handshake rather than negotiating down.

    ## Go versions

    Go 1.22 and later. The module declares 1.22 and CI runs the tests on 1.22
    and on tip.

    ## Deprecations

    `SetTimeout` still works in 1.9 and is removed in 2.0.
- label: ok
  lang: markdown
  code: |
    ## Exit codes

    `audit` exits 0 when nothing drifted and 1 when something did. Codes 2 to
    4 mean the run itself failed: 2 for an unreachable cluster, 3 for a config
    it could not parse, 4 for a chart directory that is not a chart.

    ## Ports

    The local dashboard binds the first free port from 8000 to 8100 and prints
    the one it took. `--port` pins it, and a pinned port that is taken is an
    error rather than a search.
- label: ok
  lang: markdown
  code: |
    # Maintenance windows

    Compaction runs between 02:00 and 06:00 UTC. A segment written during the
    window is compacted on the next night rather than the same one.

    Backups run Monday to Friday. A weekend backup is a manual
    `app backup --now`, which takes the write lock for the length of the copy.

    ## Overriding

    `app compact --now` runs outside the window and refuses to start while a
    backup holds the lock.
- label: ok
  note: "A rank the page has just defined, so the two ends bound a span with values between them."
  lang: markdown
  code: |
    ## Priorities

    Priority is an integer from 0 to 9, where 0 runs first. Ties are broken by
    enqueue time, so a burst of equal-priority jobs runs in the order it
    arrived.

    A job enqueued without a priority gets 5.

    ## Starvation

    A job that has waited longer than an hour is promoted one step every ten
    minutes, so a 9 cannot sit behind a steady stream of 0s forever.
- label: ok
  lang: markdown
  code: |
    ## Limits

    A frame is a four-byte big-endian length followed by that many bytes of
    CBOR. Lengths from 1 KiB to 16 MiB are accepted; anything larger is
    rejected before the body is read.

    ## Handshake

    The client sends its highest supported version and the server answers with
    the one it chose, or closes the connection.

    A peer that needs compression negotiates it here. There is no way to turn
    it on afterwards.
