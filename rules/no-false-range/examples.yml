  lang: markdown
  code: |
    # Importing

    `app import` converts a v1 dump to the v2 schema and writes it beside the
    original, leaving the input untouched.

    The conversion is one pass and holds one row in memory at a time, so a
    dump larger than the machine's memory still imports.

    ## Verifying

    `app import --verify` reads both files back and compares row counts per
    table. It does not compare row contents, which `app diff` does.
