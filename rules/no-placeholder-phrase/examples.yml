    def retry_after(response):
        header = response.headers.get("Retry-After")
        if header is None:
            raise MissingRetryAfter(response.status_code)
        if header.isdigit():
            return timedelta(seconds=int(header))
        # RFC 9110 allows an HTTP-date in this header and several CDNs send
        # one, so the numeric form is not enough on its own.
        when = parsedate_to_datetime(header)
        return when - datetime.now(timezone.utc)
