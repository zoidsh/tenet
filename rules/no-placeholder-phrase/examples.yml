    export function chunk<T>(items: readonly T[], size: number): T[][] {
      if (!Number.isInteger(size) || size <= 0) {
        throw new RangeError(`chunk size ${size} must be a positive integer`);
      }
      const out: T[][] = [];
      for (let i = 0; i < items.length; i += size) {
        out.push(items.slice(i, i + size));
      }
      return out;
    }

    export function batches<T>(items: readonly T[], limits: Limits): T[][] {
      // The upstream endpoint rejects a request carrying more items than it
      // advertises, so the size comes from the service description.
      return chunk(items, limits.maxItemsPerRequest);
    }
