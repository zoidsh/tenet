    func splitQuery(raw string) ([]Term, error) {
    	if strings.TrimSpace(raw) == "" {
    		return nil, errors.New("query must not be empty")
    	}
    	// A simplified split that ignores quoting and parentheses, which is
    	// enough for the queries we run today.
    	var terms []Term
    	for _, field := range strings.Fields(raw) {
    		key, value, ok := strings.Cut(field, ":")
    		if !ok {
    			return nil, fmt.Errorf("term %q has no field", field)
    		}
    		terms = append(terms, Term{Field: key, Value: value})
    	}
    	return terms, nil
    }
