    export function parseCursor(raw: string): Cursor {
      const decoded = Buffer.from(raw, "base64url").toString("utf8");
      const [offset, token] = decoded.split(":");
      if (token === undefined) {
        throw new MalformedCursor(raw);
      }
      // TODO(rhiannon, SEARCH-2184): drop the offset half once every client
      // has been reading token cursors for a full retention window.
      return { offset: Number(offset), token };
    }
