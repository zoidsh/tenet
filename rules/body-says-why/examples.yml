# Labelled cases for the body-says-why tenet, measured by `tenet check`.
# Each example is a pull request text: the title on the first line, a blank
# line, then the description.
- label: violation
  lines: [3, 8]
  lang: text
  code: |
    Rework the session store

    This PR reworks the session store.

    - Moves `Store` from `internal/auth` to `internal/session`
    - Splits `Get` into `Get` and `GetWithTTL`
    - Adds a `sweeper` goroutine started from `New`
    - Updates the twelve call sites to the new import path

    All existing tests pass.
- label: violation
  lines: [5, 6]
  lang: text
  code: |
    Make the retry budget configurable

    The retry budget was hard-coded to 3. It is now read from
    `RetryBudget` on the client config, defaulting to 3 so nothing
    changes for existing callers. This was done so that the retry
    budget can be configured.
- label: violation
  lines: 3
  lang: text
  code: |
    Add a per-tenant rate limiter to the ingest path

    Implements PLAT-4471. See the linked ticket and the design doc in
    Notion for the background.

    The limiter is a token bucket keyed by tenant id, filled at
    `limits.PerSecond` and drained in `ingest.Handle` before the batch
    is decoded. Requests over budget get a 429 with `Retry-After`.
  note: >-
    The ticket and the doc are where the reason is kept, not the reason. On
    the tenet's own words the description still does not communicate the why.
- label: violation
  lines: [5, 12]
  lang: text
  code: |
    Update the billing exporter

    Changes by file:

    `exporter/rows.go` — `buildRow` now takes a `*Account` rather than
