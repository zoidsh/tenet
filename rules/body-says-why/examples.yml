- label: ok
  lang: text
  code: |
    Key the session cache by tenant as well as user

    Two customers on the shared staging tenant saw each other's saved
    filters last Thursday. The cache key was the user id alone, and
    user ids are only unique within a tenant, so a collision across
    tenants served one user's entry to another.

    The key is now `tenant:user`. Existing entries have the old shape
    and are treated as misses, so the cache refills over the first
    minute after deploy.
- label: ok
  lang: text
  code: |
    Stream the export instead of building it in memory

    The nightly export for our largest account started OOM-killing the
    worker at around 900k rows; the whole result set was built as a
    slice before the first byte was written.

    Rows are now written to the response as they are scanned. Peak RSS
    on that account's export drops from 3.1G to about 40M.
- label: ok
  lang: text
  code: |
    Move off the deprecated Stripe charges API

    Stripe is turning off the Charges API for new integrations on
    1 March and has it marked deprecated in the dashboard already.

    Payments now go through PaymentIntents. The stored `charge_id` is
    kept and read for old records, and new records write
    `payment_intent_id` instead.
- label: ok
  lang: text
  code: |
    Let a workspace pin a formatter version

    Support has fielded the same complaint four times this quarter: a
    formatter release changes output, and a whole repository reformats
    on the next save with no warning.

    A workspace can now set `formatter.version`, which is honoured by
    the language server and the CLI. Unset keeps today's behaviour of
    tracking the latest release.
- label: ok
  lang: text
  code: |
    Read the feature flags from the cache, not the database

    Flag evaluation was running a query per request and is the largest
    single contributor to p99 on the API.

    `flags.Evaluate` now reads a snapshot refreshed every ten seconds
    by a background goroutine.
  note: >-
    Short, and most of the body is mechanism. One sentence still names a cost
    that existed before the change, which is what the tenet asks for.
- label: ok
  lang: text
  code: |
    Write the manifest to a temp file and rename it

    The manifest is read by the updater, which may run at any moment.
    Writing it in place left a window where the updater could read a
    half-written file, and we have one report of an update failing
    that way.

    Rename on the same filesystem is atomic, so the updater sees
    either the old manifest or the new one. The obvious alternative, a
    lock file, would have needed the updater to take the lock too, and
    the updater ships on a slower release train.
- label: ok
  lang: text
  code: |
    Drop the Node 18 build

    Node 18 went out of maintenance support in April and our own
    support policy is maintained releases only.

    The matrix now runs 20 and 22, and `engines` in package.json is
    raised to `>=20`.
