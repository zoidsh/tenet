- label: violation
  lines: [10, 11]
  lang: text
  code: |
    Replace the polling watcher with an inotify watcher

    ## What

    The `Watcher` interface gains a `Close`, and `NewWatcher` returns an
    inotify-backed implementation on Linux and the old poller elsewhere.

    ## Why

    Because we are replacing the polling watcher with one based on
    inotify, which is a better fit for the watcher.
  note: >-
    The Why heading is filled with the What restated. The label is about the
    sentence, not the heading: a reader learns nothing the diff would not say.
- label: violation
