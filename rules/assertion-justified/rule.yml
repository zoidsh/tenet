id: assertion-justified
tenet: "A comment justifying a type assertion, cast, or unchecked conversion states the invariant that makes it safe, not a placeholder."
criteria:
  true: "A value is forced into a type nothing has checked — an assertion, a cast, or a pointer reinterpretation — and nothing beside it gives a reason a reader could check: either no comment at all, or a comment that declares the line safe without saying what makes it so. A comment that names the conversion, or labels it with an adjective and nothing more, says no more than the line it sits on. A check nearby leaves the conversion unjustified unless what it settles is the type itself. Where the comment is only such a label, a guard on the size or the number of items above the conversion supplies no reason either: it settles how much data there is, never that it has the asserted type."
  false: "The conversion is checked, so a value of the wrong type takes an error path instead of being assumed away. Or the unchecked conversion carries a comment naming the invariant that makes it hold, such as where the value was produced or what a check or a construction above it established."
source: dmmulroy/anti-slop require-safety-comment-for-type-assertion
include: ["**/*.go", "**/*.ts", "**/*.tsx", "**/*.py"]
kind: [code]
tags: [code, types]
