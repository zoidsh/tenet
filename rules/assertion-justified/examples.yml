    def resolve_task(scheduler, task_id):
        node = scheduler.graph.node(task_id)
        if node.kind is not NodeKind.TASK:
            raise NotATask(task_id)
        # Every node the graph holds under the task kind was inserted as a
        # TaskNode, and a node's kind is written once and never rewritten.
        task = cast(TaskNode, node)
        return ResolvedTask(
            id=task.id,
            command=task.command,
            depends_on=tuple(task.depends_on),
        )
