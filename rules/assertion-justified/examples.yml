    export function accountId(raw: string): AccountId {
      if (!ACCOUNT_ID.test(raw)) {
        throw new MalformedAccountId(raw);
      }
      // AccountId is a branded string whose brand is nominal: the test above
      // is the whole of what it stands for, and this is the one function
      // that applies it.
      return raw as AccountId;
    }

    export function accountIds(raws: readonly string[]): AccountId[] {
      return raws.map(accountId);
