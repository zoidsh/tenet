    func (c *Catalog) PriceFor(sku string, tier string) (Money, error) {
    	table, ok := c.tables[tier]
    	if !ok {
    		return Money{}, fmt.Errorf("unknown tier %q", tier)
    	}
    	price, ok := table[sku]
    	if !ok {
    		return Money{}, ErrNoPrice
    	}
