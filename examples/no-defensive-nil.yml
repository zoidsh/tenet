- label: ok
  code: |
    func (s *Scheduler) NextRun(job Job, now time.Time) (time.Time, error) {
    	// Lookup returns nil when the job has no schedule configured.
    	spec := s.specs.Lookup(job.ID)
    	if spec == nil {
    		return time.Time{}, ErrNoSchedule
    	}
    	next := spec.Next(now)
    	if next.IsZero() {
    		return time.Time{}, ErrScheduleExhausted
    	}
    	if next.Before(now) {
    		next = now
    	}
    	return next, nil
    }
- label: ok
  code: |
    func (w *Writer) Append(ctx context.Context, rec *Record) error {
    	if rec.Metadata == nil {
    		rec.Metadata = map[string]string{}
    	}
    	blob, err := json.Marshal(rec)
    	if err != nil {
    		return fmt.Errorf("marshal record %s: %w", rec.ID, err)
    	}
    	if _, err := w.file.Write(append(blob, '\n')); err != nil {
    		return err
    	}
    	w.count++
    	if w.count%w.syncEvery == 0 {
    		return w.file.Sync()
    	}
    	return nil
    }
