    func TestArchiveRoundTrip(t *testing.T) {
    	dir := t.TempDir()
    	src := filepath.Join(dir, "notes.txt")
    	if err := os.WriteFile(src, []byte("hello archive"), 0o600); err != nil {
    		t.Fatalf("write source: %v", err)
    	}

    	archive := filepath.Join(dir, "notes.tar.gz")
    	if err := Compress(src, archive); err != nil {
    		t.Fatalf("Compress: %v", err)
    	}

    	out := filepath.Join(dir, "restored.txt")
    	if err := Extract(archive, out); err != nil {
    		t.Fatalf("Extract: %v", err)
    	}

    	got, err := os.ReadFile(out)
    	if err != nil {
    		t.Fatalf("read restored: %v", err)
    	}
    	if string(got) != "hello archive" {
    		t.Errorf("restored %q, want %q", got, "hello archive")
    	}
    }
