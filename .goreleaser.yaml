version: 2

project_name: tenetlint

builds:
  - id: tenetlint
    main: ./cmd/tenetlint
    binary: tenetlint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/zoidsh/tenetlint/internal/buildinfo.version={{.Version}}

archives:
  - id: tenetlint
    formats:
      - tar.gz
    files:
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: tenetlint
    repository:
      owner: zoidsh
      name: homebrew-tap
      # The release job's own GITHUB_TOKEN is scoped to this repository and
      # cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zoidsh/tenetlint
    description: A command-line linter for the rules you wrote in English
    hooks:
      post:
        # The binary is unsigned, so Gatekeeper quarantines it on download and
        # macOS kills it on the first run with no error a user can act on.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tenetlint"]
          end

release:
  github:
    owner: zoidsh
    name: tenetlint
  draft: false

changelog:
  use: github
