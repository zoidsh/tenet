version: 2

project_name: tenet

builds:
  - id: tenet
    main: ./cmd/tenet
    binary: tenet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/zoidsh/tenet/internal/buildinfo.version={{.Version}}

archives:
  - id: tenet
    formats:
      - tar.gz
    files:
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: tenet
    repository:
      owner: zoidsh
      name: homebrew-tap
      # The release job's own GITHUB_TOKEN is scoped to this repository and
      # cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zoidsh/tenet
    description: A command-line linter for the rules you wrote in English
    binaries:
      - tenet
    hooks:
      post:
        # The binary is unsigned, so Gatekeeper quarantines it on download and
        # macOS kills it on the first run with no error a user can act on.
        install: |
          if File.executable?("/usr/bin/xattr")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end

release:
  github:
    owner: zoidsh
    name: tenet
  draft: false

changelog:
  use: github
