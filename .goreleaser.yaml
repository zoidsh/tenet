version: 2

project_name: tenetlint

builds:
  - id: tenetlint
    main: ./cmd/tenetlint
    binary: tenetlint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/zoidsh/tenetlint/internal/buildinfo.version={{.Version}}

archives:
  - id: tenetlint
    formats:
      - tar.gz
    files:
      - README.md

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: tenetlint
    repository:
      owner: zoidsh
      name: homebrew-tap
    homepage: https://github.com/zoidsh/tenetlint
    description: A command-line linter for the rules you wrote in English

release:
  github:
    owner: zoidsh
    name: tenetlint
  draft: false

changelog:
  use: github
