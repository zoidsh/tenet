# The sentences an LLM writes into a README, a docs page or a changelog when
# nobody rewrites the draft: praise that names nothing, an opener that clears
# its throat before the first fact or a closing section that restates the one
# above it, a hedge stacked on a hedge, a conclusion about the future that
# promises nothing, and a metaphor noun standing where a literal word exists.
#
# Left out on purpose, because a regex decides them and a model should not be
# paid to: em dashes, emoji, curly quotes, buzzword lists (comprehensive,
# robust, seamless, leverage, delve), caps on exclamation marks, ellipses and
# other punctuation, title case in headings, and runs of same-length
# sentences. Those belong in a `grep -nE` in a pre-commit hook or in a Vale
# style, which answer instantly and never cost a call.
#
# Six more prose rules ship in the binary and are not listed here, because
# every rule runs at 0.8 and these do not yet hold every violation in their
# corpus above it. They carry the `standalone` tag, and a config that wants
# one names it under `rules:`. What each is waiting on, measured over 14
# labelled examples with the AUC at 1.00 in every case, so the ranking is
# right and only the confidence is short:
#
#   no-false-range         0.86 accurate at 0.8; one span whose ends are two
#                          kinds of rule sits at 0.78.
#   no-connector-colon     0.79; the colons that join two whole clauses score
#                          in the fifties, and the tenet is a two-word
#                          fragment that gives the model nothing to hold.
#   no-false-contrast      0.71; the flat two-sentence denial, as against the
#                          not-just-X-but-Y form, scores in the sixties.
#   inline-header-detail   0.64; the tenet is a carve-out rather than a
#                          prohibition, so a list whose restatement names the
#                          object of its own verb reads as permitted.
#   active-voice           0.50; the tenet licenses the passive whenever the
#                          actor is unknown, and every violation sits one
#                          sentence from that exception.
#   concrete-subject       0.93, and the one to promote first; the sentence a
#                          finding lands on is the barest subjectless one in
#                          the window rather than the abstraction that earned
#                          the verdict.
version: 1
name: unslop-prose
description: The prose an LLM writes into a README when nobody rewrites the draft.
rules:
  - project-specific
  - no-throat-clearing
  - no-hedging
  - no-generic-conclusion
  - no-metaphor-noun
