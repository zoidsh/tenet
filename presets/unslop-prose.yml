# The sentences an LLM writes into a README, a docs page or a changelog when
# nobody rewrites the draft: praise that names nothing, a closing that
# promises nothing, and a metaphor noun standing where a literal word exists.
#
# These rules overlap by design, and one paragraph can draw two findings. A
# hero sentence that rates the project and calls it the substrate everything
# builds on answers to two of them, and a roadmap that closes on a flywheel
# answers to two more. Fix the sentence and both go.
#
# Left out on purpose, because a regex decides them and a model should not be
# paid to: em dashes, emoji, curly quotes, buzzword lists (comprehensive,
# robust, seamless, leverage, delve), caps on exclamation marks, ellipses and
# other punctuation, title case in headings, and runs of same-length
# sentences. Those belong in a `grep -nE` in a pre-commit hook or in a Vale
# style, which answer instantly and never cost a call.
#
# Measured by `tenetlint check --builtin --no-cache --runs 3`, every rule at
# the 0.8 cutoff, over the corpus in this tree. Accuracy is the share of
# labelled examples on the right side of 0.8, and the deviation is the largest
# any one example moved across the three passes.
#
#   project-specific       sharp, 1.00, max sd 0.026
#   no-generic-conclusion  sharp, 1.00, max sd 0.021
#   no-metaphor-noun       sharp, 1.00, max sd 0.021
#
# Eight more prose rules ship in the binary under the standalone tag and are
# not listed below; a config that wants one names it under `rules:`. The AUC
# is 1.00 for all but two, so the wording ranks the cases correctly and what
# is missing is confidence.
#
#   no-throat-clearing     usable, 0.93. A heading restated as a paragraph
#                          scores 0.71 and two closings straddle the cutoff.
#   no-hedging             usable, 0.93. Hedges spread a clause apart rather
#                          than stacked on one claim score 0.75.
#   no-false-range         usable, 0.93. A span whose ends are two kinds of
#                          rule sits at 0.77.
#   concrete-subject       usable, 0.93, AUC 0.98. Its tenet bans passives
#                          outright, which lifts every innocent page holding
#                          one; the ok mean is 0.52.
#   no-false-contrast      usable, 0.71. The flat two-sentence denial scores
#                          in the sixties where the not-just-X-but-Y form
#                          scores well.
#   no-connector-colon     usable, 0.71. The source licenses a colon before a
#                          list or an example, and the colons that join two
#                          whole clauses read as close to that.
#   inline-header-detail   usable, 0.57. The source licenses the bold lead-in
#                          that ends in a period, and the model extends the
#                          licence to lead-ins that restate themselves.
#   active-voice           usable, 0.50, AUC 0.88. Every violation is one
#                          sentence from the tenet's own exception, and it is
#                          the weakest rule in the corpus.
version: 1
name: unslop-prose
description: The prose an LLM writes into a README when nobody rewrites the draft.
rules:
  - project-specific
  - no-generic-conclusion
  - no-metaphor-noun
