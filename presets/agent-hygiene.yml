# Measured by `tenetlint check --builtin --no-cache --runs 3`, every rule at
# the 0.8 cutoff, over the corpus in this tree. Accuracy is the share of
# labelled examples on the right side of 0.8, and the deviation is the largest
# any one example moved across the three passes.
#
#   comment-why            sharp, 1.00
#   no-mocking             sharp, 1.00
#   no-transcript-comment  sharp, 1.00
#   no-placeholder-phrase  sharp, 1.00
#   assertion-justified    sharp, 1.00, max sd 0.02, on two three-pass runs of
#                          three; the third read it usable at 0.93.
#
# Two rules ship in the binary and are not listed below, under the standalone
# tag, so a config that wants one names it under `rules:`.
#
#   no-fallback       usable, 0.93, max sd 0.03, on two three-pass runs of
#                     three; the third read it sharp at 1.00.
#   no-defensive-nil  usable, 0.79, max sd 0.032, with three violations
#                     between 0.78 and 0.79 and two of them crossing the
#                     cutoff between passes. Two are TypeScript and one is
#                     Python, languages its corpus grew after its criteria
#                     were written.
#
# assertion-justified and no-fallback both straddle the cutoff rather than
# sitting either side of it, and which verdict a run reports depends on one
# example each: assertion-justified's weakest violation, which lands around
# 0.79, and no-fallback's locale resolver, an acceptable example that lands
# around 0.81 and has been seen anywhere from 0.77 to 0.81. They are in
# opposite kinds of trouble. A violation under the cutoff is a rule that
# misses; an ok example over it is a rule that fires on innocent code, which
# is why no-fallback is the one held out although its accuracy reads higher.
#
# The corpus task owns the wording of all three rules above. These numbers
# are what the corpus measures today, not a target.
version: 1
name: agent-hygiene
description: The habits a coding agent slips into when nobody reads the diff.
rules:
  - comment-why
  - no-mocking
  - no-transcript-comment
  - no-placeholder-phrase
  - assertion-justified
