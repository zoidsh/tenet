# Every rule here holds its corpus above the 0.8 cutoff, measured by
# `tenet check --builtin --no-cache --runs 3`, which judges each labelled
# example three times and reports what moved between the passes. Three passes
# rather than one because a rule that reads sharp once can read usable the
# next time, and the preset is a promise about the rule, not about a run.
# The two rules this pass reworded were measured over four such runs; the
# rest of the preset over the three of those that covered every rule.
#
# comment-why, no-mocking, no-transcript-comment, no-placeholder-phrase and
# no-fallback read sharp in every run that covered them, with no example of
# theirs moving across the cutoff in any pass. no-fallback's nearest
# acceptable example is the invoice whose tax rate comes from a keyed lookup
# with a zero default,
# at 0.71, which the corpus keeps as the edge the tenet has not decided; it
# is the highest anything acceptable scores here. That rule was held out of
# this preset while a different acceptable case, its locale resolver, scored
# 0.81 and made it fire on innocent code. A false criterion saying what a
# selection is dropped the resolver to 0.30.
#
# assertion-justified is the one rule here that straddles the cutoff, and it
# straddles on a single example: its weakest violation, a header parse that
# scores 0.78 to 0.81 and so decides on its own whether a run reads sharp or
# usable. It crossed in one of the three runs that covered it. A violation
# under the cutoff is a rule that misses, which is the milder of the two
# failures; an acceptable example over it would be a rule firing on innocent
# code.
#
# no-defensive-nil stays out, under the standalone tag, so a config that
# wants it names it under `rules:`. Naming the TypeScript and Python
# spellings of an unreachable check lifted its corpus to sharp in three of
# the four runs, but the other read usable at 0.94, on one violation: the
# TypeScript row builder, which scores 0.79 to 0.82. A rule whose verdict is
# a coin toss between runs is not a promise this preset can make.
version: 1
name: agent-hygiene
description: The habits a coding agent slips into when nobody reads the diff.
rules:
  - comment-why
  - no-mocking
  - no-transcript-comment
  - no-placeholder-phrase
  - assertion-justified
  - no-fallback
