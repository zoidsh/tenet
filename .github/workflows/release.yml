name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance is signed against this workflow's OIDC identity.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # goreleaser builds the changelog from the history back to the last tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build and publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask lands in zoidsh/homebrew-tap, another repository, which the
          # job's own GITHUB_TOKEN cannot write to.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: goreleaser release --clean

      - name: Stage the npm packages at the tag's version
        run: sh npm/stage.sh dist "${GITHUB_REF_NAME#v}"

      - name: Publish the npm packages
        env:
          # npm publish authenticates with this, not with the GitHub token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The platform packages go first: the entry package depends on them, and
        # an install that reaches npm between the two would find them missing.
        run: |
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            npm publish --provenance --access public "npm/platforms/$platform"
          done
          npm publish --provenance --access public npm/tenetlint

      - name: Move the v1 tag to this release
        if: startsWith(github.ref_name, 'v1.')
        run: |
          git tag -f v1
          git push -f origin v1
