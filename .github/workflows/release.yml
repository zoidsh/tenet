name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance is signed against this workflow's OIDC identity.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # goreleaser builds the changelog from the history back to the last tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The marketplace serves the plugin straight from this repository and
      # Claude Code caches an install under the manifest's version, so a stale
      # field hides the release from everyone who already installed the plugin.
      - name: Check the plugin version matches the tag
        run: |
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          tag=${GITHUB_REF_NAME#v}
          if [ "$plugin" != "$tag" ]; then
            echo "plugin.json is $plugin but the tag is $tag; bump plugin/.claude-plugin/plugin.json and retag" >&2
            exit 1
          fi

      - uses: jdx/mise-action@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build and publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask lands in zoidsh/homebrew-tap, another repository, which the
          # job's own GITHUB_TOKEN cannot write to.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: goreleaser release --clean

      - name: Stage the npm packages at the tag's version
        run: sh npm/stage.sh dist "${GITHUB_REF_NAME#v}"

      - name: Publish the npm packages
        env:
          # npm publish authenticates with this, not with the GitHub token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: sh npm/publish.sh "${GITHUB_REF_NAME#v}"

      - name: Move the v1 tag to this release
        if: startsWith(github.ref_name, 'v1.')
        run: |
          git tag -f v1
          git push -f origin v1
